name: REST-AI-GoogleCloud
type: template
description: API template for REST-AI-GoogleCloud
gateway: apigee
schemaVersion: 1.0.0
features:
  - ../features/ai-completions.yaml
  - ../features/ai-pre-validate.yaml
  - ../features/ai-failover.yaml
  - ../features/ai-post-analytics.yaml
parameters:
  - name: ModelRouting
    default: "true"
  - name: ModelRoutingKey
    default: ModelRoutingText
endpoints:
  - name: completions
    basePath: /v1/chat/completions
    routes:
      - name: route-googlecloud
        condition: target.route = "googlecloud"
        target: googlecloud
      - name: route-googlecloud-oai
        condition: target.route = "googlecloud-oai"
        target: googlecloud-oai
      - name: route-openai
        condition: target.route = "openai"
        target: openai
      - name: route-anthropic
        condition: target.route = "anthropic"
        target: anthropic
      - name: default
        target: googlecloud
targets:
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/endpoints/openapi/chat/completions
  - name: anthropic
    url: https://api.anthropic.com
  - name: openai
    url: https://api.openai.com
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
