openapi: 3.0.0
info:
  title: OpenAI Chat Completions API
  description: Basic request structure validation for OpenAI Chat Completions API.
  version: 1.0.0
paths:
  /:
    post:
      summary: Create chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              additionalProperties: false
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    additionalProperties: false
                    properties:
                      role:
                        type: string
                      content:
                        nullable: true
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: object
                      name:
                        type: string
                      tool_calls:
                        type: array
                        items:
                          type: object
                      tool_call_id:
                        type: string
                temperature:
                  type: number
                top_p:
                  type: number
                n:
                  type: integer
                stream:
                  type: boolean
                stop:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                max_tokens:
                  type: integer
                presence_penalty:
                  type: number
                frequency_penalty:
                  type: number
                logit_bias:
                  type: object
                user:
                  type: string
                tools:
                  type: array
                  items:
                    type: object
                tool_choice:
                  oneOf:
                    - type: string
                    - type: object
                response_format:
                  type: object
                seed:
                  type: integer
                service_tier:
                  type: string
      responses:
        "200":
          description: Successful response
