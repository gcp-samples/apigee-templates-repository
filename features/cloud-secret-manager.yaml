gateway: apigee
schemaVersion: 1.0.0
name: cloud-secret-manager
displayName: Cloud Secret Manager Access & Cache
type: feature
description: Retrieves secret payloads from Google Cloud Secret Manager with payload decoding and environment-level KVM response
  caching.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://secretmanager.googleapis.com/v1/projects/{organization.name}/secrets/{secret.name}/versions/latest:access
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/secrets/lookup
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-DecodeSecretPayload
    - name: KVM-CacheSecret
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://secretmanager.googleapis.com/v1/projects/{organization.name}/secrets/{secret.name}/versions/latest:access
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://secretmanager.googleapis.com/v1/projects/{organization.name}/secrets/{secret.name}/versions/latest:access
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-DecodeSecretPayload
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-DecodeSecretPayload
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-DecodeSecretPayload
      properties: {}
      source: "// JS-DecodeSecretPayload - Custom logic for cloud-secret-manager\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"cloud-secret-manager.processed\"\
        , \"true\");\n    context.setVariable(\"cloud-secret-manager.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"cloud-secret-manager\",\n                \"processedAt\": new Date().toISOString()\n \
        \           };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-DecodeSecretPayload: \" + err);\n}\n"
- name: KVM-CacheSecret
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: KVM-CacheSecret
        continueOnError: 'true'
        enabled: 'true'
      displayName: KVM-CacheSecret
      properties: {}
      assignVariable:
        name: cloud-secret-manager.trafficState
        value: healthy
resources: []
tests: []
