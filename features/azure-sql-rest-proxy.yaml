gateway: apigee
schemaVersion: 1.0.0
name: azure-sql-rest-proxy
displayName: Azure SQL Database REST Management Proxy
type: feature
description: Proxies Azure SQL Database management and elastic pool REST APIs with Entra ID bearer token authentication and
  resource filtering.
categories:
- draft
- azure
parameters:
- name: TargetEndpointUrl
  default: https://management.azure.com/subscriptions/{azure.subscriptionId}/resourceGroups/{azure.rg}/providers/Microsoft.Sql/servers
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/azure/sql
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: AM-SetAzureOAuthHeader
    - name: JS-FilterAzureSqlList
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://management.azure.com/subscriptions/{azure.subscriptionId}/resourceGroups/{azure.rg}/providers/Microsoft.Sql/servers
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://management.azure.com/subscriptions/{azure.subscriptionId}/resourceGroups/{azure.rg}/providers/Microsoft.Sql/servers
endpoints: []
targets: []
policies:
- name: AM-SetAzureOAuthHeader
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetAzureOAuthHeader
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetAzureOAuthHeader
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: azure-sql-rest-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FilterAzureSqlList
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-FilterAzureSqlList
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-FilterAzureSqlList
      properties: {}
      source: "// JS-FilterAzureSqlList - Custom logic for azure-sql-rest-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"azure-sql-rest-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"azure-sql-rest-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"azure-sql-rest-proxy\",\n                \"processedAt\": new Date().toISOString()\n \
        \           };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FilterAzureSqlList: \" + err);\n}\n"
resources: []
tests: []
