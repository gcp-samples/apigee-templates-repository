# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
name: ai-completions
displayName: OpenAI Chat Completions API Proxy
type: feature
description: Feature for the OpenAI Chat Completions API
documentation: ""
gateway: apigee
schemaVersion: 1.0.0
categories: []
parameters: []
endpoints:
  - name: completions
    basePath: /v1/chat/completions
    routes:
      - name: route-googlecloud
        condition: target.route = "googlecloud"
        target: googlecloud
      - name: route-googlecloud-oai
        condition: target.route = "googlecloud-oai"
        target: googlecloud-oai
      - name: route-openai
        condition: target.route = "openai"
        target: openai
      - name: route-anthropic
        condition: target.route = "anthropic"
        target: anthropic
      - name: default
        target: googlecloud
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: OAS-Validation
    faultRules: []
targets:
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/endpoints/openapi/chat/completions
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/endpoints/openapi/chat/completions
  - name: anthropic
    url: https://api.anthropic.com
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://api.anthropic.com
  - name: openai
    url: https://api.openai.com
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://api.openai.com
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
    flows: []
    faultRules: []
    httpTargetConnection:
      Properties: {}
      URL: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
policies:
  - name: OAS-Validation
    type: OASValidation
    content:
      OASValidation:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: OAS-Validation
        DisplayName: OAS-Validation
        Properties: {}
        Options:
          ValidateMessageBody: "true"
        OASResource: oas://openapi.yaml
resources:
  - name: openapi.yaml
    type: oas
    content: |
      openapi: 3.0.0
      info:
        title: OpenAI Chat Completions API
        description: Basic request structure validation for OpenAI Chat Completions API.
        version: 1.0.0
      paths:
        /:
          post:
            summary: Create chat completion
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - model
                      - messages
                    additionalProperties: false
                    properties:
                      model:
                        type: string
                      messages:
                        type: array
                        items:
                          type: object
                          required:
                            - role
                            - content
                          additionalProperties: false
                          properties:
                            role:
                              type: string
                            content:
                              nullable: true
                              oneOf:
                                - type: string
                                - type: array
                                  items:
                                    type: object
                            name:
                              type: string
                            tool_calls:
                              type: array
                              items:
                                type: object
                            tool_call_id:
                              type: string
                      temperature:
                        type: number
                      top_p:
                        type: number
                      n:
                        type: integer
                      stream:
                        type: boolean
                      stop:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      max_tokens:
                        type: integer
                      presence_penalty:
                        type: number
                      frequency_penalty:
                        type: number
                      logit_bias:
                        type: object
                      user:
                        type: string
                      tools:
                        type: array
                        items:
                          type: object
                      tool_choice:
                        oneOf:
                          - type: string
                          - type: object
                      response_format:
                        type: object
                      seed:
                        type: integer
                      service_tier:
                        type: string
            responses:
              "200":
                description: Successful response
tests: []
