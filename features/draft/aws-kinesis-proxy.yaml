# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: aws-kinesis-proxy
displayName: AWS Kinesis Data Stream Record Ingestion
type: feature
description: Ingests real-time high-throughput streaming records into Amazon Kinesis Data Streams with partition key hashing
  and SigV4 signing.
categories:
- draft
- aws
parameters:
- name: TargetEndpointUrl
  default: https://kinesis.{aws.region}.amazonaws.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/aws/kinesis/put
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-BuildKinesisPayload
    - name: JS-GenerateAwsSigV4
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://kinesis.{aws.region}.amazonaws.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-BuildKinesisPayload
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-BuildKinesisPayload
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-BuildKinesisPayload
      Properties: {}
      Source: "// JS-BuildKinesisPayload - Custom logic for aws-kinesis-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-kinesis-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-kinesis-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-kinesis-proxy\",\n                \"processedAt\": new Date().toISOString()\n    \
        \        };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-BuildKinesisPayload: \" + err);\n}\n"
- name: JS-GenerateAwsSigV4
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-GenerateAwsSigV4
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-GenerateAwsSigV4
      Properties: {}
      Source: "// JS-GenerateAwsSigV4 - Custom logic for aws-kinesis-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-kinesis-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-kinesis-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-kinesis-proxy\",\n                \"processedAt\": new Date().toISOString()\n    \
        \        };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-GenerateAwsSigV4: \" + err);\n}\n"
resources: []
tests: []
