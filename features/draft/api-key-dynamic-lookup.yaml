# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: api-key-dynamic-lookup
displayName: Dynamic Multi-Tenant API Key Lookup
type: feature
description: Performs dynamic multi-tenant API key resolution against encrypted KVM or external IDP with tier-based rate limit
  assignment.
categories:
- draft
- security
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/security/key-lookup
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: KVM-LookupClientKey
    - name: JS-AssignTenantTier
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: api-key-dynamic-lookup-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: JS-AssignTenantTier
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-AssignTenantTier
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-AssignTenantTier
      Properties: {}
      Source: "// JS-AssignTenantTier - Custom logic for api-key-dynamic-lookup\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"api-key-dynamic-lookup.processed\"\
        , \"true\");\n    context.setVariable(\"api-key-dynamic-lookup.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"api-key-dynamic-lookup\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-AssignTenantTier: \" + err);\n}\n"
resources: []
tests: []
