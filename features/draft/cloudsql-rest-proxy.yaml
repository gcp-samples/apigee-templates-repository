# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: cloudsql-rest-proxy
displayName: Google Cloud SQL REST API Proxy
type: feature
description: Proxies requests to Google Cloud SQL Admin & Query APIs with IAM authentication, query payload validation, and
  connection error handling.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://sqladmin.googleapis.com/v1/projects/{organization.name}/instances
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/cloudsql
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-FilterInstanceMetadata
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://sqladmin.googleapis.com/v1/projects/{organization.name}/instances
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-FilterInstanceMetadata
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FilterInstanceMetadata
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FilterInstanceMetadata
      Properties: {}
      Source: "// JS-FilterInstanceMetadata - Custom logic for cloudsql-rest-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"cloudsql-rest-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"cloudsql-rest-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"cloudsql-rest-proxy\",\n                \"processedAt\": new Date().toISOString()\n  \
        \          };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FilterInstanceMetadata: \" + err);\n}\n"
resources: []
tests: []
