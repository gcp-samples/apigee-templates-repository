# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: cloud-speech-proxy
displayName: Cloud Speech-to-Text Recognition Proxy
type: feature
description: Proxies Google Cloud Speech-to-Text v2 API for synchronous and batch audio transcriptions with audio configuration
  validation.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://speech.googleapis.com/v1/speech:recognize
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/speech/recognize
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-FormatSpeechTranscript
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatSpeechTranscript
  faultRules: []
defaultTarget:
  name: default
  url: https://speech.googleapis.com/v1/speech:recognize
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-FormatSpeechTranscript
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FormatSpeechTranscript
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FormatSpeechTranscript
      Properties: {}
      Source: "// JS-FormatSpeechTranscript - Custom logic for cloud-speech-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"cloud-speech-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"cloud-speech-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"cloud-speech-proxy\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatSpeechTranscript: \" + err);\n}\n"
resources: []
tests: []
