# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: cloud-logging-sink
displayName: Cloud Logging Custom Telemetry Sink
type: feature
description: Asynchronously streams structured API audit logs and execution metrics into Google Cloud Logging (Stackdriver)
  with severity classification.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://logging.googleapis.com/v2/entries:write
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/logging/entries
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps: []
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-ConstructLogEntry
  faultRules: []
defaultTarget:
  name: default
  url: https://logging.googleapis.com/v2/entries:write
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-ConstructLogEntry
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-ConstructLogEntry
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-ConstructLogEntry
      Properties: {}
      Source: "// JS-ConstructLogEntry - Custom logic for cloud-logging-sink\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"cloud-logging-sink.processed\"\
        , \"true\");\n    context.setVariable(\"cloud-logging-sink.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"cloud-logging-sink\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-ConstructLogEntry: \" + err);\n}\n"
resources: []
tests: []
