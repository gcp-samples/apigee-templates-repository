# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: ollama-local-proxy
displayName: Ollama Self-Hosted LLM Gateway
type: feature
description: Proxies on-premise or VPC self-hosted Ollama model instances (/api/generate, /api/chat) with request authentication
  and payload normalization.
categories:
- draft
- ai
parameters:
- name: TargetEndpointUrl
  default: http://{ollama.host}:11434/api
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/ollama/api
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-NormalizeOllamaStream
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: http://{ollama.host}:11434/api
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-NormalizeOllamaStream
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-NormalizeOllamaStream
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-NormalizeOllamaStream
      Properties: {}
      Source: "// JS-NormalizeOllamaStream - Custom logic for ollama-local-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"ollama-local-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"ollama-local-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"ollama-local-proxy\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-NormalizeOllamaStream: \" + err);\n}\n"
resources: []
tests: []
