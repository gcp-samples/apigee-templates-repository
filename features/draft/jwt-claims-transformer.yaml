# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: jwt-claims-transformer
displayName: JWT Claims Extraction & Context Enrichment
type: feature
description: Parses and verifies incoming JSON Web Tokens (JWT), extracts nested custom claims, and injects them as HTTP headers
  for backend microservices.
categories:
- draft
- security
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/security/jwt-enrich
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-ExtractJwtClaims
    - name: AM-InjectClaimsHeaders
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-ExtractJwtClaims
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-ExtractJwtClaims
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-ExtractJwtClaims
      Properties: {}
      Source: "// JS-ExtractJwtClaims - Custom logic for jwt-claims-transformer\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"jwt-claims-transformer.processed\"\
        , \"true\");\n    context.setVariable(\"jwt-claims-transformer.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"jwt-claims-transformer\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-ExtractJwtClaims: \" + err);\n}\n"
- name: AM-InjectClaimsHeaders
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-InjectClaimsHeaders
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-InjectClaimsHeaders
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: jwt-claims-transformer
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
resources: []
tests: []
