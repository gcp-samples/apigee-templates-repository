# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: gitlab-api-proxy
displayName: GitLab REST API v4 Proxy
type: feature
description: Proxies GitLab Projects, Pipelines, and Issues REST API with PRIVATE-TOKEN header injection and project ID URL-encoding.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://gitlab.com/api/v4
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/gitlab
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetGitLabToken
    - name: JS-FormatGitLabPipelines
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatGitLabPipelines
  faultRules: []
defaultTarget:
  name: default
  url: https://gitlab.com/api/v4
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: gitlab-api-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: AM-SetGitLabToken
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetGitLabToken
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetGitLabToken
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: gitlab-api-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FormatGitLabPipelines
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FormatGitLabPipelines
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FormatGitLabPipelines
      Properties: {}
      Source: "// JS-FormatGitLabPipelines - Custom logic for gitlab-api-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"gitlab-api-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"gitlab-api-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"gitlab-api-proxy\",\n                \"processedAt\": new Date().toISOString()\n     \
        \       };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatGitLabPipelines: \" + err);\n}\n"
resources: []
tests: []
