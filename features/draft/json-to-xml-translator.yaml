# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: json-to-xml-translator
displayName: JSON to XML Bidirectional Formatter
type: feature
description: Converts incoming JSON payloads to XML format using Apigee JSONtoXML policies and transforms backend XML responses
  back into clean JSON.
categories:
- draft
- transformation
parameters:
- name: TargetEndpointUrl
  default: https://xml-backend.internal/api/legacy
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/integration/json-xml
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JSON-to-XML-Policy
    - name: XML-to-JSON-Policy
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://xml-backend.internal/api/legacy
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies: []
resources: []
tests: []
