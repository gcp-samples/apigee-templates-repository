# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: workday-raas-proxy
displayName: Workday Report-as-a-Service (RaaS) Proxy
type: feature
description: Proxies Workday RaaS endpoints with ISU (Integration System User) credentials, XML-to-JSON reporting conversion,
  and pagination.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://{workday.host}/ccx/service/customreport2/{workday.tenant}/{workday.user}
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/workday/raas
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetWorkdayAuth
    - name: JS-ConvertWorkdayXmlToJson
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://{workday.host}/ccx/service/customreport2/{workday.tenant}/{workday.user}
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: workday-raas-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: AM-SetWorkdayAuth
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetWorkdayAuth
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetWorkdayAuth
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: workday-raas-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-ConvertWorkdayXmlToJson
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-ConvertWorkdayXmlToJson
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-ConvertWorkdayXmlToJson
      Properties: {}
      Source: "// JS-ConvertWorkdayXmlToJson - Custom logic for workday-raas-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"workday-raas-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"workday-raas-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"workday-raas-proxy\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-ConvertWorkdayXmlToJson: \" + err);\n}\n"
resources: []
tests: []
