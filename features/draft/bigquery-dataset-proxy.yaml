# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: bigquery-dataset-proxy
displayName: BigQuery Dataset & Table Management
type: feature
description: Provides secure API proxying for BigQuery dataset and table metadata operations with access control and JSON
  structure normalization.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://bigquery.googleapis.com/bigquery/v2/projects/{organization.name}/datasets
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/bigquery/datasets
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps: []
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-NormalizeDatasetResponse
  faultRules: []
defaultTarget:
  name: default
  url: https://bigquery.googleapis.com/bigquery/v2/projects/{organization.name}/datasets
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-NormalizeDatasetResponse
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-NormalizeDatasetResponse
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-NormalizeDatasetResponse
      Properties: {}
      Source: "// JS-NormalizeDatasetResponse - Custom logic for bigquery-dataset-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"bigquery-dataset-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"bigquery-dataset-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"bigquery-dataset-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-NormalizeDatasetResponse: \" + err);\n}\n"
resources: []
tests: []
