# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: elasticsearch-rest-proxy
displayName: Elasticsearch & OpenSearch REST Proxy
type: feature
description: Proxies Elasticsearch and OpenSearch `_search` queries with Basic/API key auth, DSL query validation, and hit
  extraction.
categories:
- draft
- ai
parameters:
- name: TargetEndpointUrl
  default: https://{elastic.host}:9200/{elastic.index}/_search
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/elasticsearch
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetElasticAuth
    - name: JS-FormatElasticHits
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatElasticHits
  faultRules: []
defaultTarget:
  name: default
  url: https://{elastic.host}:9200/{elastic.index}/_search
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: elasticsearch-rest-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: AM-SetElasticAuth
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetElasticAuth
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetElasticAuth
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: elasticsearch-rest-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FormatElasticHits
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FormatElasticHits
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FormatElasticHits
      Properties: {}
      Source: "// JS-FormatElasticHits - Custom logic for elasticsearch-rest-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"elasticsearch-rest-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"elasticsearch-rest-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"elasticsearch-rest-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatElasticHits: \" + err);\n}\n"
resources: []
tests: []
