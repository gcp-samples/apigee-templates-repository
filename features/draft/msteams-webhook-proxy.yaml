# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: msteams-webhook-proxy
displayName: Microsoft Teams Adaptive Cards Proxy
type: feature
description: Accepts incident alerts and formats them into Microsoft Teams Adaptive Cards 1.4 JSON payloads sent to Office
  365 Incoming Webhooks.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://outlook.office.com/webhook/{teams.webhookPath}
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/teams/notify
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-BuildAdaptiveCardPayload
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://outlook.office.com/webhook/{teams.webhookPath}
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-BuildAdaptiveCardPayload
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-BuildAdaptiveCardPayload
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-BuildAdaptiveCardPayload
      Properties: {}
      Source: "// JS-BuildAdaptiveCardPayload - Custom logic for msteams-webhook-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"msteams-webhook-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"msteams-webhook-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"msteams-webhook-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-BuildAdaptiveCardPayload: \" + err);\n}\n"
resources: []
tests: []
