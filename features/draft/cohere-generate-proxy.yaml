# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: cohere-generate-proxy
displayName: Cohere Chat & Embeddings API Proxy
type: feature
description: Proxies Cohere v1 /chat and /embed endpoints with Bearer token authentication, input validation, and token billing
  capture.
categories:
- draft
- ai
parameters:
- name: TargetEndpointUrl
  default: https://api.cohere.com/v1
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/cohere
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetCohereAuth
    - name: JS-CaptureCohereUsage
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-CaptureCohereUsage
  faultRules: []
defaultTarget:
  name: default
  url: https://api.cohere.com/v1
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: cohere-generate-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: AM-SetCohereAuth
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetCohereAuth
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetCohereAuth
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: cohere-generate-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-CaptureCohereUsage
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-CaptureCohereUsage
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-CaptureCohereUsage
      Properties: {}
      Source: "// JS-CaptureCohereUsage - Custom logic for cohere-generate-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"cohere-generate-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"cohere-generate-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"cohere-generate-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-CaptureCohereUsage: \" + err);\n}\n"
resources: []
tests: []
