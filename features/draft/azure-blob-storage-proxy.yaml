# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: azure-blob-storage-proxy
displayName: Azure Blob Storage REST Gateway
type: feature
description: Proxies Azure Blob Storage REST API with Shared Access Signature (SAS) token generation and container object
  operations.
categories:
- draft
- azure
parameters:
- name: TargetEndpointUrl
  default: https://{azure.storageAccount}.blob.core.windows.net/{azure.container}
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/azure/blobs
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: AM-SetAzureBlobHeaders
    - name: JS-FormatBlobList
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatBlobList
  faultRules: []
defaultTarget:
  name: default
  url: https://{azure.storageAccount}.blob.core.windows.net/{azure.container}
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: AM-SetAzureBlobHeaders
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetAzureBlobHeaders
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetAzureBlobHeaders
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: azure-blob-storage-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FormatBlobList
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FormatBlobList
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FormatBlobList
      Properties: {}
      Source: "// JS-FormatBlobList - Custom logic for azure-blob-storage-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"azure-blob-storage-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"azure-blob-storage-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"azure-blob-storage-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatBlobList: \" + err);\n}\n"
resources: []
tests: []
