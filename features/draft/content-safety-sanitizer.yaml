# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: content-safety-sanitizer
displayName: Request Content Safety & Injection Sanitizer
type: feature
description: Inspects incoming JSON payloads in-flight for SQL injection, Cross-Site Scripting (XSS), command injection, and
  malicious unicode patterns.
categories:
- draft
- security
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/security/sanitize
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-SanitizePayloadContent
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-SanitizePayloadContent
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-SanitizePayloadContent
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-SanitizePayloadContent
      Properties: {}
      Source: "// JS-SanitizePayloadContent - Custom logic for content-safety-sanitizer\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"content-safety-sanitizer.processed\"\
        , \"true\");\n    context.setVariable(\"content-safety-sanitizer.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"content-safety-sanitizer\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-SanitizePayloadContent: \" + err);\n}\n"
- name: RF-MaliciousPayloadDetected
  type: RaiseFault
  content:
    RaiseFault:
      metadata:
        name: RF-MaliciousPayloadDetected
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: RF-MaliciousPayloadDetected
      Properties: {}
      FaultResponse:
        Set:
          Headers:
            Header:
              metadata:
                name: Content-Type
              Value: application/json
          Payload:
            contentType: application/json
            Value: '{"error": "RF-MaliciousPayloadDetected", "message": "Security or validation fault occurred in feature
              content-safety-sanitizer"}'
          StatusCode: '400'
          ReasonPhrase: Bad Request
      IgnoreUnresolvedVariables: 'true'
resources: []
tests: []
