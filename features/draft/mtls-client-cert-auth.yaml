# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: mtls-client-cert-auth
displayName: Mutual TLS Client Certificate Validator
type: feature
description: Inspects mTLS client certificate attributes (Subject DN, SAN, Issuer, Serial Number, Fingerprint) and enforces
  organizational identity policies.
categories:
- draft
- security
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/security/mtls-auth
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-InspectClientCertificate
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-InspectClientCertificate
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-InspectClientCertificate
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-InspectClientCertificate
      Properties: {}
      Source: "// JS-InspectClientCertificate - Custom logic for mtls-client-cert-auth\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"mtls-client-cert-auth.processed\"\
        , \"true\");\n    context.setVariable(\"mtls-client-cert-auth.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"mtls-client-cert-auth\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-InspectClientCertificate: \" + err);\n}\n"
- name: RF-CertValidationFailed
  type: RaiseFault
  content:
    RaiseFault:
      metadata:
        name: RF-CertValidationFailed
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: RF-CertValidationFailed
      Properties: {}
      FaultResponse:
        Set:
          Headers:
            Header:
              metadata:
                name: Content-Type
              Value: application/json
          Payload:
            contentType: application/json
            Value: '{"error": "RF-CertValidationFailed", "message": "Security or validation fault occurred in feature mtls-client-cert-auth"}'
          StatusCode: '400'
          ReasonPhrase: Bad Request
      IgnoreUnresolvedVariables: 'true'
resources: []
tests: []
