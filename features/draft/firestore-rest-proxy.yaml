# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: firestore-rest-proxy
displayName: Cloud Firestore Document & Collection Proxy
type: feature
description: Proxies Cloud Firestore REST API with bidirectional translation between Firestore typed JSON (stringValue, integerValue,
  mapValue) and clean standard JSON.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://firestore.googleapis.com/v1/projects/{organization.name}/databases/(default)/documents
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/firestore
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-FirestoreJsonTransformer
    - name: JS-FirestoreRequestTransformer
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://firestore.googleapis.com/v1/projects/{organization.name}/databases/(default)/documents
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-FirestoreJsonTransformer
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FirestoreJsonTransformer
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FirestoreJsonTransformer
      Properties: {}
      Source: "// JS-FirestoreJsonTransformer - Custom logic for firestore-rest-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"firestore-rest-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"firestore-rest-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"firestore-rest-proxy\",\n                \"processedAt\": new Date().toISOString()\n \
        \           };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FirestoreJsonTransformer: \" + err);\n}\n"
- name: JS-FirestoreRequestTransformer
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FirestoreRequestTransformer
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FirestoreRequestTransformer
      Properties: {}
      Source: "// JS-FirestoreRequestTransformer - Custom logic for firestore-rest-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"firestore-rest-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"firestore-rest-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"firestore-rest-proxy\",\n                \"processedAt\": new Date().toISOString()\n \
        \           };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FirestoreRequestTransformer: \" + err);\n}\n"
resources: []
tests: []
