# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: spike-arrest-burst-smoother
displayName: Spike Arrest & Concurrency Burst Smoother
type: feature
description: Protects backend microservices from sudden traffic spikes and DDoS surges using Apigee SpikeArrest and ConcurrentRateLimit
  policies.
categories:
- draft
- traffic
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/traffic/spike-arrest
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: Spike-Arrest-Policy
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: Spike-Arrest-Policy
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: Spike-Arrest-Policy
        continueOnError: 'true'
        enabled: 'true'
      DisplayName: Spike-Arrest-Policy
      Properties: {}
      AssignVariable:
        Name: spike-arrest-burst-smoother.trafficState
        Value: healthy
- name: RF-SpikeArrestExceeded
  type: RaiseFault
  content:
    RaiseFault:
      metadata:
        name: RF-SpikeArrestExceeded
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: RF-SpikeArrestExceeded
      Properties: {}
      FaultResponse:
        Set:
          Headers:
            Header:
              metadata:
                name: Content-Type
              Value: application/json
          Payload:
            contentType: application/json
            Value: '{"error": "RF-SpikeArrestExceeded", "message": "Security or validation fault occurred in feature spike-arrest-burst-smoother"}'
          StatusCode: '400'
          ReasonPhrase: Bad Request
      IgnoreUnresolvedVariables: 'true'
resources: []
tests: []
