# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: stripe-payments-proxy
displayName: Stripe Payments & Customers API Proxy
type: feature
description: Proxies Stripe REST API for PaymentIntents, Customers, and Charges with Secret Key injection, Idempotency-Key
  propagation, and error mapping.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://api.stripe.com/v1
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/stripe
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetStripeAuth
    - name: JS-HandleStripeErrors
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://api.stripe.com/v1
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: stripe-payments-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: AM-SetStripeAuth
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetStripeAuth
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetStripeAuth
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: stripe-payments-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-HandleStripeErrors
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-HandleStripeErrors
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-HandleStripeErrors
      Properties: {}
      Source: "// JS-HandleStripeErrors - Custom logic for stripe-payments-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"stripe-payments-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"stripe-payments-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"stripe-payments-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-HandleStripeErrors: \" + err);\n}\n"
resources: []
tests: []
