# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: oauth2-token-exchange
displayName: OAuth 2.0 RFC 8693 Token Exchange
type: feature
description: Implements RFC 8693 OAuth 2.0 Token Exchange to securely swap external IDP tokens (Okta, Azure AD, Cognito) for
  internal Apigee / GCP access tokens.
categories:
- draft
- security
parameters:
- name: TargetEndpointUrl
  default: none
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/oauth2/token-exchange
  routes:
  - name: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-ValidateSubjectToken
    - name: AM-GenerateExchangedToken
  - name: PostFlow
    mode: Response
    steps: []
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-ValidateSubjectToken
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-ValidateSubjectToken
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-ValidateSubjectToken
      Properties: {}
      Source: "// JS-ValidateSubjectToken - Custom logic for oauth2-token-exchange\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"oauth2-token-exchange.processed\"\
        , \"true\");\n    context.setVariable(\"oauth2-token-exchange.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"oauth2-token-exchange\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-ValidateSubjectToken: \" + err);\n}\n"
- name: AM-GenerateExchangedToken
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-GenerateExchangedToken
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-GenerateExchangedToken
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: oauth2-token-exchange
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
resources: []
tests: []
