# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: aws-secretsmanager-proxy
displayName: AWS Secrets Manager Lookup & Cache
type: feature
description: Fetches secrets from AWS Secrets Manager using SigV4 authorization with local in-memory/KVM caching to reduce
  AWS API call frequency.
categories:
- draft
- aws
parameters:
- name: TargetEndpointUrl
  default: https://secretsmanager.{aws.region}.amazonaws.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/aws/secrets/get
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-BuildSecretManagerRequest
    - name: JS-GenerateAwsSigV4
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://secretsmanager.{aws.region}.amazonaws.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-BuildSecretManagerRequest
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-BuildSecretManagerRequest
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-BuildSecretManagerRequest
      Properties: {}
      Source: "// JS-BuildSecretManagerRequest - Custom logic for aws-secretsmanager-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-secretsmanager-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-secretsmanager-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"aws-secretsmanager-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-BuildSecretManagerRequest: \" + err);\n}\n"
- name: JS-GenerateAwsSigV4
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-GenerateAwsSigV4
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-GenerateAwsSigV4
      Properties: {}
      Source: "// JS-GenerateAwsSigV4 - Custom logic for aws-secretsmanager-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-secretsmanager-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-secretsmanager-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"aws-secretsmanager-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-GenerateAwsSigV4: \" + err);\n}\n"
resources: []
tests: []
