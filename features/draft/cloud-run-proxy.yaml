# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: cloud-run-proxy
displayName: Google Cloud Run Service Proxy
type: feature
description: Proxies incoming requests to a private or public Google Cloud Run microservice with automated Google OIDC ID
  token minting and path routing.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://my-service-xyz.a.run.app
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/cloudrun
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: AM-SetOidcHeader
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-LogTargetTiming
  faultRules: []
defaultTarget:
  name: default
  url: https://my-service-xyz.a.run.app
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
    authentication:
      googleIdToken:
        audience:
          ref: target.url
endpoints: []
targets: []
policies:
- name: AM-SetOidcHeader
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetOidcHeader
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetOidcHeader
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: cloud-run-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-LogTargetTiming
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-LogTargetTiming
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-LogTargetTiming
      Properties: {}
      Source: "// JS-LogTargetTiming - Custom logic for cloud-run-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"cloud-run-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"cloud-run-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"cloud-run-proxy\",\n                \"processedAt\": new Date().toISOString()\n      \
        \      };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2) {}\n\
        \    }\n} catch (err) {\n    print(\"Error in JS-LogTargetTiming: \" + err);\n}\n"
resources: []
tests: []
