# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: aws-bedrock-proxy
displayName: AWS Bedrock Foundation Models Proxy
type: feature
description: Proxies AWS Bedrock Converse and InvokeModel endpoints for Claude, Titan, and Llama models with SigV4 authentication
  and token usage capture.
categories:
- draft
- aws
parameters:
- name: TargetEndpointUrl
  default: https://bedrock-runtime.{aws.region}.amazonaws.com/model/{aws.bedrockModel}/invoke
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/aws/bedrock/invoke
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-GenerateAwsSigV4
    - name: JS-CaptureBedrockUsage
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-CaptureBedrockUsage
  faultRules: []
defaultTarget:
  name: default
  url: https://bedrock-runtime.{aws.region}.amazonaws.com/model/{aws.bedrockModel}/invoke
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: JS-GenerateAwsSigV4
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-GenerateAwsSigV4
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-GenerateAwsSigV4
      Properties: {}
      Source: "// JS-GenerateAwsSigV4 - Custom logic for aws-bedrock-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-bedrock-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-bedrock-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-bedrock-proxy\",\n                \"processedAt\": new Date().toISOString()\n    \
        \        };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-GenerateAwsSigV4: \" + err);\n}\n"
- name: JS-CaptureBedrockUsage
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-CaptureBedrockUsage
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-CaptureBedrockUsage
      Properties: {}
      Source: "// JS-CaptureBedrockUsage - Custom logic for aws-bedrock-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-bedrock-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-bedrock-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-bedrock-proxy\",\n                \"processedAt\": new Date().toISOString()\n    \
        \        };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-CaptureBedrockUsage: \" + err);\n}\n"
resources: []
tests: []
