# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: alloydb-rest-proxy
displayName: Google Cloud AlloyDB Admin & Query Proxy
type: feature
description: Secure proxy for Google Cloud AlloyDB for PostgreSQL clusters with connection pooling metadata, IAM token exchange,
  and query proxying.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://alloydb.googleapis.com/v1/projects/{organization.name}/locations/{alloydb.location}/clusters
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/alloydb
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-FormatAlloyDbClusters
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatAlloyDbClusters
  faultRules: []
defaultTarget:
  name: default
  url: https://alloydb.googleapis.com/v1/projects/{organization.name}/locations/{alloydb.location}/clusters
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-FormatAlloyDbClusters
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FormatAlloyDbClusters
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FormatAlloyDbClusters
      Properties: {}
      Source: "// JS-FormatAlloyDbClusters - Custom logic for alloydb-rest-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"alloydb-rest-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"alloydb-rest-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"alloydb-rest-proxy\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatAlloyDbClusters: \" + err);\n}\n"
resources: []
tests: []
