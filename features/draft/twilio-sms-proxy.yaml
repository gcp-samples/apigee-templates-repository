# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: twilio-sms-proxy
displayName: Twilio SMS & Messaging API Proxy
type: feature
description: Dispatches SMS messages via Twilio Messaging API with E.164 phone number validation, Basic Auth credentials,
  and URL-encoded body transformation.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://api.twilio.com/2010-04-01/Accounts/{twilio.accountSid}/Messages.json
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/twilio/sms
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: JS-TransformJsonToUrlEncoded
    - name: AM-SetTwilioAuth
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://api.twilio.com/2010-04-01/Accounts/{twilio.accountSid}/Messages.json
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: twilio-sms-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: JS-TransformJsonToUrlEncoded
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-TransformJsonToUrlEncoded
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-TransformJsonToUrlEncoded
      Properties: {}
      Source: "// JS-TransformJsonToUrlEncoded - Custom logic for twilio-sms-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"twilio-sms-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"twilio-sms-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"twilio-sms-proxy\",\n                \"processedAt\": new Date().toISOString()\n     \
        \       };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-TransformJsonToUrlEncoded: \" + err);\n}\n"
- name: AM-SetTwilioAuth
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetTwilioAuth
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetTwilioAuth
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: twilio-sms-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
resources: []
tests: []
