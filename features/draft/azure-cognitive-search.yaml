# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: azure-cognitive-search
displayName: Azure AI Search Query & Indexing Proxy
type: feature
description: Proxies Azure AI Search (formerly Cognitive Search) index querying and document updates with api-key authentication
  and result formatting.
categories:
- draft
- azure
parameters:
- name: TargetEndpointUrl
  default: https://{azure.searchService}.search.windows.net/indexes/{azure.searchIndex}/docs/search?api-version=2024-05-01-preview
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/azure/search
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetAzureSearchKey
    - name: JS-FormatSearchResults
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatSearchResults
  faultRules: []
defaultTarget:
  name: default
  url: https://{azure.searchService}.search.windows.net/indexes/{azure.searchIndex}/docs/search?api-version=2024-05-01-preview
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: azure-cognitive-search-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: AM-SetAzureSearchKey
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetAzureSearchKey
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetAzureSearchKey
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: azure-cognitive-search
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FormatSearchResults
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FormatSearchResults
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FormatSearchResults
      Properties: {}
      Source: "// JS-FormatSearchResults - Custom logic for azure-cognitive-search\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"azure-cognitive-search.processed\"\
        , \"true\");\n    context.setVariable(\"azure-cognitive-search.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"azure-cognitive-search\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatSearchResults: \" + err);\n}\n"
resources: []
tests: []
