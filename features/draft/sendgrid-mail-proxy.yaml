# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: sendgrid-mail-proxy
displayName: SendGrid v3 Mail Send API Proxy
type: feature
description: Proxies SendGrid v3 Mail Send API with Bearer token injection, recipient list deduplication, and template ID
  mapping.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://api.sendgrid.com/v3/mail/send
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/sendgrid/mail
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetSendGridAuth
    - name: JS-ValidateEmailRecipients
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://api.sendgrid.com/v3/mail/send
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: sendgrid-mail-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: AM-SetSendGridAuth
  type: AssignMessage
  content:
    AssignMessage:
      metadata:
        name: AM-SetSendGridAuth
        continueOnError: 'false'
        enabled: 'true'
      DisplayName: AM-SetSendGridAuth
      Properties: {}
      Set:
        Headers:
          Header:
          - metadata:
              name: X-Apigee-Feature
            Value: sendgrid-mail-proxy
          - metadata:
              name: X-Apigee-Time
            Value: '{system.timestamp}'
      IgnoreUnresolvedVariables: 'true'
      AssignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-ValidateEmailRecipients
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-ValidateEmailRecipients
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-ValidateEmailRecipients
      Properties: {}
      Source: "// JS-ValidateEmailRecipients - Custom logic for sendgrid-mail-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"sendgrid-mail-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"sendgrid-mail-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"sendgrid-mail-proxy\",\n                \"processedAt\": new Date().toISOString()\n  \
        \          };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-ValidateEmailRecipients: \" + err);\n}\n"
resources: []
tests: []
