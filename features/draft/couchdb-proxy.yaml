# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: couchdb-proxy
displayName: Apache CouchDB / Cloudant Document Proxy
type: feature
description: Proxies Apache CouchDB / IBM Cloudant REST endpoints with Basic Auth injection, revision ID tracking, and Mango
  query translation.
categories:
- draft
- database
parameters:
- name: TargetEndpointUrl
  default: https://{couchdb.host}/{couchdb.database}
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/couchdb
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: JS-FormatCouchDbRows
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatCouchDbRows
  faultRules: []
defaultTarget:
  name: default
  url: https://{couchdb.host}/{couchdb.database}
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    KeyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: couchdb-proxy-secrets
      DisplayName: KVM-LoadCredentials
      Properties: {}
      ExclusiveCache: 'false'
      ExpiryTimeInSecs: '300'
      Get:
      - metadata:
          assignTo: private.targetApiKey
        Key:
          Parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        Key:
          Parameter: ApiSecret
      Scope: environment
- name: JS-FormatCouchDbRows
  type: Javascript
  content:
    Javascript:
      metadata:
        name: JS-FormatCouchDbRows
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      DisplayName: JS-FormatCouchDbRows
      Properties: {}
      Source: "// JS-FormatCouchDbRows - Custom logic for couchdb-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"couchdb-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"couchdb-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"couchdb-proxy\",\n                \"processedAt\": new Date().toISOString()\n        \
        \    };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2) {}\n\
        \    }\n} catch (err) {\n    print(\"Error in JS-FormatCouchDbRows: \" + err);\n}\n"
resources: []
tests: []
