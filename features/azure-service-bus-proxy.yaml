gateway: apigee
schemaVersion: 1.0.0
name: azure-service-bus-proxy
displayName: Azure Service Bus Message Dispatcher
type: feature
description: Sends messages to Azure Service Bus Queues and Topics using SAS token authentication (SharedAccessSignature)
  with message properties.
categories:
- draft
- azure
parameters:
- name: TargetEndpointUrl
  default: https://{azure.sbNamespace}.servicebus.windows.net/{azure.sbEntity}/messages
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/azure/servicebus/send
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-GenerateServiceBusSasToken
    - name: AM-SetServiceBusHeaders
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://{azure.sbNamespace}.servicebus.windows.net/{azure.sbEntity}/messages
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{azure.sbNamespace}.servicebus.windows.net/{azure.sbEntity}/messages
endpoints: []
targets: []
policies:
- name: JS-GenerateServiceBusSasToken
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-GenerateServiceBusSasToken
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-GenerateServiceBusSasToken
      properties: {}
      source: "// JS-GenerateServiceBusSasToken - Custom logic for azure-service-bus-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"azure-service-bus-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"azure-service-bus-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"azure-service-bus-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-GenerateServiceBusSasToken: \" + err);\n}\n"
- name: AM-SetServiceBusHeaders
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetServiceBusHeaders
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetServiceBusHeaders
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: azure-service-bus-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
resources: []
tests: []
