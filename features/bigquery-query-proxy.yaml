gateway: apigee
schemaVersion: 1.0.0
name: bigquery-query-proxy
displayName: BigQuery SQL Query & Result Transformer
type: feature
description: Executes parameterized SQL queries against Google BigQuery REST API with schema flattening, row mapping, and
  JSON response normalization.
categories:
- draft
- gcp
parameters:
- name: TargetEndpointUrl
  default: https://bigquery.googleapis.com/bigquery/v2/projects/{organization.name}/queries
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/bigquery/query
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-TransformBigQueryRows
    - name: AM-SetQueryPayload
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://bigquery.googleapis.com/bigquery/v2/projects/{organization.name}/queries
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://bigquery.googleapis.com/bigquery/v2/projects/{organization.name}/queries
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-TransformBigQueryRows
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-TransformBigQueryRows
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-TransformBigQueryRows
      properties: {}
      source: "// JS-TransformBigQueryRows - Custom logic for bigquery-query-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"bigquery-query-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"bigquery-query-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"bigquery-query-proxy\",\n                \"processedAt\": new Date().toISOString()\n \
        \           };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-TransformBigQueryRows: \" + err);\n}\n"
- name: AM-SetQueryPayload
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetQueryPayload
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetQueryPayload
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: bigquery-query-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
resources: []
tests: []
