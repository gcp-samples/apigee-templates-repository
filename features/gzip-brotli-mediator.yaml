gateway: apigee
schemaVersion: 1.0.0
name: gzip-brotli-mediator
displayName: HTTP Gzip & Brotli Content Compression Mediator
type: feature
description: Handles Accept-Encoding negotiation, decompressing payloads on ingest when required and compressing upstream
  responses for bandwidth savings.
categories:
- draft
- transformation
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/integration/compression
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-HandleEncodingHeaders
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://backend.example.com
endpoints: []
targets: []
policies:
- name: JS-HandleEncodingHeaders
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-HandleEncodingHeaders
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-HandleEncodingHeaders
      properties: {}
      source: "// JS-HandleEncodingHeaders - Custom logic for gzip-brotli-mediator\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"gzip-brotli-mediator.processed\"\
        , \"true\");\n    context.setVariable(\"gzip-brotli-mediator.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"gzip-brotli-mediator\",\n                \"processedAt\": new Date().toISOString()\n \
        \           };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-HandleEncodingHeaders: \" + err);\n}\n"
resources: []
tests: []
