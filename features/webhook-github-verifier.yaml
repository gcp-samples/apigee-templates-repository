gateway: apigee
schemaVersion: 1.0.0
name: webhook-github-verifier
displayName: GitHub Webhook HMAC-SHA256 Verifier
type: feature
description: Verifies `X-Hub-Signature-256` headers on incoming GitHub Webhooks against a shared secret before routing to
  internal build workers.
categories:
- draft
- security
parameters:
- name: TargetEndpointUrl
  default: https://internal-ci.example.com/github-events
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/webhooks/github
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-VerifyGitHubWebhookSignature
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://internal-ci.example.com/github-events
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://internal-ci.example.com/github-events
endpoints: []
targets: []
policies:
- name: JS-VerifyGitHubWebhookSignature
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-VerifyGitHubWebhookSignature
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-VerifyGitHubWebhookSignature
      properties: {}
      source: "// JS-VerifyGitHubWebhookSignature - Custom logic for webhook-github-verifier\ntry {\n    var reqContent =\
        \ context.getVariable(\"request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson\
        \ = JSON.parse(reqContent); } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"\
        webhook-github-verifier.processed\", \"true\");\n    context.setVariable(\"webhook-github-verifier.timestamp\", Date.now().toString());\n\
        \    \n    // Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\"\
        );\n    if (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"\
        _apigee\"] = {\n                \"feature\": \"webhook-github-verifier\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-VerifyGitHubWebhookSignature: \" + err);\n}\n"
- name: RF-InvalidWebhookSignature
  type: RaiseFault
  content:
    raiseFault:
      metadata:
        name: RF-InvalidWebhookSignature
        continueOnError: 'false'
        enabled: 'true'
      displayName: RF-InvalidWebhookSignature
      properties: {}
      faultResponse:
        set:
          headers:
            header:
              metadata:
                name: Content-Type
              value: application/json
          payload:
            contentType: application/json
            value: '{"error": "RF-InvalidWebhookSignature", "message": "Security or validation fault occurred in feature webhook-github-verifier"}'
          statusCode: '400'
          reasonPhrase: Bad Request
      ignoreUnresolvedVariables: 'true'
resources: []
tests: []
