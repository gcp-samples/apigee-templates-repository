gateway: apigee
schemaVersion: 1.0.0
name: aws-lambda-proxy
displayName: AWS Lambda Serverless Function Proxy
type: feature
description: Invokes AWS Lambda functions directly via AWS REST API using AWS Signature Version 4 (SigV4) authentication with
  synchronous and asynchronous invocation modes.
categories:
- draft
- aws
parameters:
- name: TargetEndpointUrl
  default: https://lambda.{aws.region}.amazonaws.com/2015-03-31/functions/{aws.functionName}/invocations
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/aws/lambda
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-GenerateAwsSigV4
    - name: AM-SetLambdaHeaders
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://lambda.{aws.region}.amazonaws.com/2015-03-31/functions/{aws.functionName}/invocations
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://lambda.{aws.region}.amazonaws.com/2015-03-31/functions/{aws.functionName}/invocations
endpoints: []
targets: []
policies:
- name: JS-GenerateAwsSigV4
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-GenerateAwsSigV4
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-GenerateAwsSigV4
      properties: {}
      source: "// JS-GenerateAwsSigV4 - Custom logic for aws-lambda-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-lambda-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-lambda-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-lambda-proxy\",\n                \"processedAt\": new Date().toISOString()\n     \
        \       };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-GenerateAwsSigV4: \" + err);\n}\n"
- name: AM-SetLambdaHeaders
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetLambdaHeaders
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetLambdaHeaders
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: aws-lambda-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
resources: []
tests: []
