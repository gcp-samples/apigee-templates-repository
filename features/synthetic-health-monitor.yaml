gateway: apigee
schemaVersion: 1.0.0
name: synthetic-health-monitor
displayName: Synthetic Deep Health Check & Readiness Endpoint
type: feature
description: Provides an automated `/healthz` & `/readyz` endpoint that executes parallel health probes against downstream
  targets, KVMs, and caches.
categories:
- draft
- observability
parameters:
- name: TargetEndpointUrl
  default: none
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /healthz
  routes:
  - name: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: SC-ProbeDownstreamTarget
    - name: JS-AssembleHealthStatus
  - name: PostFlow
    mode: Response
    steps: []
  faultRules: []
endpoints: []
targets: []
policies:
- name: SC-ProbeDownstreamTarget
  type: ServiceCallout
  content:
    serviceCallout:
      metadata:
        name: SC-ProbeDownstreamTarget
        continueOnError: 'true'
        enabled: 'true'
      displayName: SC-ProbeDownstreamTarget
      properties: {}
      request:
        metadata:
          clearPayload: 'false'
          variable: SC-ProbeDownstreamTargetRequest
        ignoreUnresolvedVariables: 'true'
      response: SC-ProbeDownstreamTargetResponse
      httpTargetConnection:
        properties: {}
        url: https://httpbin.org/anything
- name: JS-AssembleHealthStatus
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-AssembleHealthStatus
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-AssembleHealthStatus
      properties: {}
      source: "// JS-AssembleHealthStatus - Custom logic for synthetic-health-monitor\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"synthetic-health-monitor.processed\"\
        , \"true\");\n    context.setVariable(\"synthetic-health-monitor.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"synthetic-health-monitor\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-AssembleHealthStatus: \" + err);\n}\n"
resources: []
tests: []
