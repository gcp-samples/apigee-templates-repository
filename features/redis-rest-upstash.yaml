gateway: apigee
schemaVersion: 1.0.0
name: redis-rest-upstash
displayName: Redis REST API Gateway (Upstash / GCP Memorystore)
type: feature
description: Proxies Redis key-value commands (GET, SET, HGETALL, LPUSH, PIPELINE) via HTTP REST interface with token authentication
  and response formatting.
categories:
- draft
- database
parameters:
- name: TargetEndpointUrl
  default: https://{redis.host}.upstash.io
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/redis
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetRedisAuth
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatRedisResponse
  faultRules: []
defaultTarget:
  name: default
  url: https://{redis.host}.upstash.io
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{redis.host}.upstash.io
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: redis-rest-upstash-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: JS-FormatRedisResponse
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-FormatRedisResponse
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-FormatRedisResponse
      properties: {}
      source: "// JS-FormatRedisResponse - Custom logic for redis-rest-upstash\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"redis-rest-upstash.processed\"\
        , \"true\");\n    context.setVariable(\"redis-rest-upstash.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"redis-rest-upstash\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatRedisResponse: \" + err);\n}\n"
- name: AM-SetRedisAuth
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetRedisAuth
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetRedisAuth
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: redis-rest-upstash
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
resources: []
tests: []
