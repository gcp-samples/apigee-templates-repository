gateway: apigee
schemaVersion: 1.0.0
name: clickhouse-http-proxy
displayName: ClickHouse Columnar HTTP Proxy
type: feature
description: Proxies analytical queries to ClickHouse HTTP interface with FORMAT JSON extraction, compression support, and
  query timeout enforcement.
categories:
- draft
- database
parameters:
- name: TargetEndpointUrl
  default: https://{clickhouse.host}:8443
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/clickhouse/query
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: JS-FormatClickHouseResult
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatClickHouseResult
  faultRules: []
defaultTarget:
  name: default
  url: https://{clickhouse.host}:8443
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{clickhouse.host}:8443
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: clickhouse-http-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: JS-FormatClickHouseResult
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-FormatClickHouseResult
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-FormatClickHouseResult
      properties: {}
      source: "// JS-FormatClickHouseResult - Custom logic for clickhouse-http-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"clickhouse-http-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"clickhouse-http-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"clickhouse-http-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatClickHouseResult: \" + err);\n}\n"
resources: []
tests: []
