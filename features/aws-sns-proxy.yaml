gateway: apigee
schemaVersion: 1.0.0
name: aws-sns-proxy
displayName: AWS SNS Topic Notification Publisher
type: feature
description: Publishes structured push notifications and broadcast alerts to Amazon Simple Notification Service (SNS) topics
  with message attributes.
categories:
- draft
- aws
parameters:
- name: TargetEndpointUrl
  default: https://sns.{aws.region}.amazonaws.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/aws/sns/publish
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-BuildSnsPayload
    - name: JS-GenerateAwsSigV4
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://sns.{aws.region}.amazonaws.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://sns.{aws.region}.amazonaws.com
endpoints: []
targets: []
policies:
- name: JS-BuildSnsPayload
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-BuildSnsPayload
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-BuildSnsPayload
      properties: {}
      source: "// JS-BuildSnsPayload - Custom logic for aws-sns-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-sns-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-sns-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-sns-proxy\",\n                \"processedAt\": new Date().toISOString()\n        \
        \    };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2) {}\n\
        \    }\n} catch (err) {\n    print(\"Error in JS-BuildSnsPayload: \" + err);\n}\n"
- name: JS-GenerateAwsSigV4
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-GenerateAwsSigV4
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-GenerateAwsSigV4
      properties: {}
      source: "// JS-GenerateAwsSigV4 - Custom logic for aws-sns-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-sns-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-sns-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-sns-proxy\",\n                \"processedAt\": new Date().toISOString()\n        \
        \    };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2) {}\n\
        \    }\n} catch (err) {\n    print(\"Error in JS-GenerateAwsSigV4: \" + err);\n}\n"
resources: []
tests: []
