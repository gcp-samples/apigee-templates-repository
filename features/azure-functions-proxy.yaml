gateway: apigee
schemaVersion: 1.0.0
name: azure-functions-proxy
displayName: Azure Functions HTTP Trigger Proxy
type: feature
description: Proxies incoming API calls to serverless Azure Functions with automated Function Key injection (x-functions-key)
  or Entra ID OAuth token injection.
categories:
- draft
- azure
parameters:
- name: TargetEndpointUrl
  default: https://{azure.appService}.azurewebsites.net/api
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/azure/functions
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetAzureFunctionKey
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-LogAzureResponse
  faultRules: []
defaultTarget:
  name: default
  url: https://{azure.appService}.azurewebsites.net/api
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{azure.appService}.azurewebsites.net/api
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: azure-functions-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetAzureFunctionKey
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetAzureFunctionKey
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetAzureFunctionKey
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: azure-functions-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-LogAzureResponse
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-LogAzureResponse
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-LogAzureResponse
      properties: {}
      source: "// JS-LogAzureResponse - Custom logic for azure-functions-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"azure-functions-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"azure-functions-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"azure-functions-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-LogAzureResponse: \" + err);\n}\n"
resources: []
tests: []
