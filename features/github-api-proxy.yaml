gateway: apigee
schemaVersion: 1.0.0
name: github-api-proxy
displayName: GitHub REST API v3 Gateway
type: feature
description: Proxies GitHub REST API with Personal Access Token (PAT) / GitHub App installation token injection, User-Agent
  header compliance, and rate limit tracking.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://api.github.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/github
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetGitHubHeaders
    - name: JS-TrackGitHubRateLimit
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://api.github.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://api.github.com
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: github-api-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetGitHubHeaders
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetGitHubHeaders
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetGitHubHeaders
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: github-api-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-TrackGitHubRateLimit
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-TrackGitHubRateLimit
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-TrackGitHubRateLimit
      properties: {}
      source: "// JS-TrackGitHubRateLimit - Custom logic for github-api-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"github-api-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"github-api-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"github-api-proxy\",\n                \"processedAt\": new Date().toISOString()\n     \
        \       };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-TrackGitHubRateLimit: \" + err);\n}\n"
resources: []
tests: []
