gateway: apigee
schemaVersion: 1.0.0
name: servicenow-table-proxy
displayName: ServiceNow Table API Incident & CMDB Proxy
type: feature
description: Proxies ServiceNow Table API for incident tracking, change requests, and CMDB records with OAuth/Basic Auth and
  sysparm validation.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://{servicenow.instance}.service-now.com/api/now/table
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/servicenow/table
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetServiceNowAuth
    - name: JS-FormatServiceNowResults
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatServiceNowResults
  faultRules: []
defaultTarget:
  name: default
  url: https://{servicenow.instance}.service-now.com/api/now/table
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{servicenow.instance}.service-now.com/api/now/table
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: servicenow-table-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetServiceNowAuth
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetServiceNowAuth
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetServiceNowAuth
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: servicenow-table-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FormatServiceNowResults
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-FormatServiceNowResults
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-FormatServiceNowResults
      properties: {}
      source: "// JS-FormatServiceNowResults - Custom logic for servicenow-table-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"servicenow-table-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"servicenow-table-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"servicenow-table-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatServiceNowResults: \" + err);\n}\n"
resources: []
tests: []
