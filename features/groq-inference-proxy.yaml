gateway: apigee
schemaVersion: 1.0.0
name: groq-inference-proxy
displayName: Groq Ultra-Fast LPU Inference Proxy
type: feature
description: Proxies GroqCloud ultra-fast OpenAI-compatible LLM inference API with Bearer token authentication and latency
  monitoring.
categories:
- draft
- ai
parameters:
- name: TargetEndpointUrl
  default: https://api.groq.com/openai/v1/chat/completions
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/groq/openai/v1/chat/completions
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetGroqAuth
    - name: JS-CaptureGroqLatency
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-CaptureGroqLatency
  faultRules: []
defaultTarget:
  name: default
  url: https://api.groq.com/openai/v1/chat/completions
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://api.groq.com/openai/v1/chat/completions
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: groq-inference-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetGroqAuth
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetGroqAuth
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetGroqAuth
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: groq-inference-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-CaptureGroqLatency
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-CaptureGroqLatency
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-CaptureGroqLatency
      properties: {}
      source: "// JS-CaptureGroqLatency - Custom logic for groq-inference-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"groq-inference-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"groq-inference-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"groq-inference-proxy\",\n                \"processedAt\": new Date().toISOString()\n \
        \           };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-CaptureGroqLatency: \" + err);\n}\n"
resources: []
tests: []
