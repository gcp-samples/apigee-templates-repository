gateway: apigee
schemaVersion: 1.0.0
name: vertex-ai-search-proxy
displayName: Vertex AI Search & Conversation Proxy
type: feature
description: Proxies Google Cloud Vertex AI Search & Conversation (Agent Builder) data store query API with Google OAuth token
  injection and citation parsing.
categories:
- draft
- ai
parameters:
- name: TargetEndpointUrl
  default: https://discoveryengine.googleapis.com/v1alpha/projects/{organization.name}/locations/global/collections/default_collection/dataStores/{vertex.dataStore}/servingConfigs/default_search:search
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/vertex/search
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-FormatVertexSearchResults
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatVertexSearchResults
  faultRules: []
defaultTarget:
  name: default
  url: https://discoveryengine.googleapis.com/v1alpha/projects/{organization.name}/locations/global/collections/default_collection/dataStores/{vertex.dataStore}/servingConfigs/default_search:search
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://discoveryengine.googleapis.com/v1alpha/projects/{organization.name}/locations/global/collections/default_collection/dataStores/{vertex.dataStore}/servingConfigs/default_search:search
    authentication:
      googleAccessToken:
        scopes:
          scope: https://www.googleapis.com/auth/cloud-platform
endpoints: []
targets: []
policies:
- name: JS-FormatVertexSearchResults
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-FormatVertexSearchResults
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-FormatVertexSearchResults
      properties: {}
      source: "// JS-FormatVertexSearchResults - Custom logic for vertex-ai-search-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"vertex-ai-search-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"vertex-ai-search-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"vertex-ai-search-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatVertexSearchResults: \" + err);\n}\n"
resources: []
tests: []
