name: ai-routing-evaluate
displayName: ai-routing-evaluate
type: feature
description: ai-routing-evaluate
documentation: ""
gateway: apigee
schemaVersion: 1.0.0
categories: []
parameters:
  - name: SimpleModel
    default: google/gemini-3.5-flash-lite
  - name: MediumModel
    default: google/gemini-3.7-flash
  - name: ComplexModel
    default: google/gemini-3.7-flash
  - name: ThinkingModel
    default: google/gemini-3.7-flash
defaultEndpoint:
  name: default
  basePath: /ai-routing-evaluate
  routes:
    - name: default
      target: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: SC-ModelJudge
  faultRules: []
defaultTarget:
  name: default
  url: https://aiplatform.googleapis.com
  flows: []
  faultRules: []
  httpTargetConnection:
    Properties: {}
    URL: https://aiplatform.googleapis.com
endpoints: []
targets: []
policies:
  - name: SC-ModelJudge
    type: ServiceCallout
    content:
      ServiceCallout:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: SC-ModelJudge
        DisplayName: SC-ModelJudge
        Properties: {}
        Request:
          metadata:
            clearPayload: "true"
            variable: evaluationRequest
          IgnoreUnresolvedVariables: "false"
          Set:
            Verb: POST
            Headers:
              Header:
                - Name: Content-Type
                  _text: application/json
            Payload:
              metadata:
                contentType: application/json
              _text: |
                {
                  "contents": [
                    {
                      "role": "USER",
                      "parts": [
                        {
                          "text": "Evaluate which model type should be used for this prompt, just answer with the type name (SIMPLE, MEDIUM, COMPLEX, REASONING): {ai.requestPrompt}"
                        }
                      ]
                    }
                  ]
                }
        Response: evaluationResponse
        HTTPTargetConnection:
          Properties: {}
          URL: https://aiplatform.googleapis.com/v1/projects/{organization.name}/locations/global/publishers/google/models/gemini-3.5-flash-lite:generateContent
          Authentication:
            GoogleAccessToken:
              Scopes:
                Scope: https://www.googleapis.com/auth/cloud-platform
resources: []
tests: []
