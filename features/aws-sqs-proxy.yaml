gateway: apigee
schemaVersion: 1.0.0
name: aws-sqs-proxy
displayName: AWS SQS Queue Message Producer
type: feature
description: Sends JSON messages to AWS Simple Queue Service (SQS) queues with automatic SigV4 signing, message deduplication
  IDs, and delay configuration.
categories:
- draft
- aws
parameters:
- name: TargetEndpointUrl
  default: https://sqs.{aws.region}.amazonaws.com/{aws.accountId}/{aws.queueName}
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/aws/sqs/send
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-BuildSqsPayload
    - name: JS-GenerateAwsSigV4
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://sqs.{aws.region}.amazonaws.com/{aws.accountId}/{aws.queueName}
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://sqs.{aws.region}.amazonaws.com/{aws.accountId}/{aws.queueName}
endpoints: []
targets: []
policies:
- name: JS-BuildSqsPayload
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-BuildSqsPayload
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-BuildSqsPayload
      properties: {}
      source: "// JS-BuildSqsPayload - Custom logic for aws-sqs-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-sqs-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-sqs-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-sqs-proxy\",\n                \"processedAt\": new Date().toISOString()\n        \
        \    };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2) {}\n\
        \    }\n} catch (err) {\n    print(\"Error in JS-BuildSqsPayload: \" + err);\n}\n"
- name: JS-GenerateAwsSigV4
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-GenerateAwsSigV4
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-GenerateAwsSigV4
      properties: {}
      source: "// JS-GenerateAwsSigV4 - Custom logic for aws-sqs-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"aws-sqs-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"aws-sqs-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"aws-sqs-proxy\",\n                \"processedAt\": new Date().toISOString()\n        \
        \    };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2) {}\n\
        \    }\n} catch (err) {\n    print(\"Error in JS-GenerateAwsSigV4: \" + err);\n}\n"
resources: []
tests: []
