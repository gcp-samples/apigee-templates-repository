gateway: apigee
schemaVersion: 1.0.0
name: pii-regex-redactor
displayName: In-Flight PII Regex Redactor
type: feature
description: High-performance in-flight JavaScript regex sanitizer redacting Social Security Numbers (SSN), Credit Cards,
  and emails from request/response bodies.
categories:
- draft
- security
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/security/pii-redact
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-RedactPiiPatterns
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://backend.example.com
endpoints: []
targets: []
policies:
- name: JS-RedactPiiPatterns
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-RedactPiiPatterns
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-RedactPiiPatterns
      properties: {}
      source: "// JS-RedactPiiPatterns - Custom logic for pii-regex-redactor\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"pii-regex-redactor.processed\"\
        , \"true\");\n    context.setVariable(\"pii-regex-redactor.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"pii-regex-redactor\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-RedactPiiPatterns: \" + err);\n}\n"
resources: []
tests: []
