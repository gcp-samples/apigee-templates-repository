gateway: apigee
schemaVersion: 1.0.0
type: feature
description: Proxy for Anthropic models.
endpoints:
  - name: anthropic
    basePath: /v1/messages
    routes:
      - name: anthropic
        target: anthropic
    flows: []
    faultRules: []
targets:
  - name: anthropic
    url: https://api.anthropic.com/v1/messages
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: KVM-LoadCredentials
          - name: AM-SetHeader
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://api.anthropic.com/v1/messages
policies:
  - name: KVM-LoadCredentials
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: KVM-LoadCredentials
          mapIdentifier: AI-Secrets
        displayName: KVM-LoadCredentials
        properties: {}
        exclusiveCache: "false"
        expiryTimeInSecs: "10"
        get:
          - metadata:
              assignTo: ai.anthropicKey
            key:
              parameter: Anthropic_Key
        scope: environment
  - name: AM-SetHeader
    type: AssignMessage
    content:
      assignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-SetHeader
        displayName: AM-SetHeader
        properties: {}
        set:
          headers:
            header:
              metadata:
                name: x-api-key
              value: "{ai.anthropicKey}"
        ignoreUnresolvedVariables: "true"
        assignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
resources: []
tests: []
