gateway: apigee
schemaVersion: 1.0.0
name: multipart-form-parser
displayName: Multipart Form-Data to JSON Converter
type: feature
description: Parses multipart/form-data boundary payloads, extracts text fields and binary file metadata, and converts the
  request into structured JSON.
categories:
- draft
- transformation
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com/upload
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/integration/multipart-parse
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-ParseMultipartFormData
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com/upload
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://backend.example.com/upload
endpoints: []
targets: []
policies:
- name: JS-ParseMultipartFormData
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-ParseMultipartFormData
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-ParseMultipartFormData
      properties: {}
      source: "// JS-ParseMultipartFormData - Custom logic for multipart-form-parser\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"multipart-form-parser.processed\"\
        , \"true\");\n    context.setVariable(\"multipart-form-parser.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"multipart-form-parser\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-ParseMultipartFormData: \" + err);\n}\n"
resources: []
tests: []
