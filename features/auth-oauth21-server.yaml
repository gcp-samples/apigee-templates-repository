  - name: JS-ValidateAuthorize
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ValidateAuthorize
        DisplayName: JS-ValidateAuthorize
        Properties: {}
        Source: |
          var clientId = context.getVariable("auth_client_id");
          var redirectUri = context.getVariable("auth_redirect_uri");
          var responseType = context.getVariable("auth_response_type");
          var codeChallenge = context.getVariable("auth_code_challenge");
          var codeChallengeMethod = context.getVariable("auth_code_challenge_method");
          var isCimd = context.getVariable("is_cimd") === "true";

          var error = null;
          var errorDesc = null;
          var clientDisplayName = clientId;

          if (!clientId) {
            error = "invalid_client";
            errorDesc = "client_id parameter is required.";
          } else if (!redirectUri) {
            error = "invalid_request";
            errorDesc = "redirect_uri parameter is required.";
          } else if (responseType !== "code") {
            error = "unsupported_response_type";
            errorDesc = "Only response_type=code is supported under OAuth 2.1.";
          } else if (!codeChallenge) {
            error = "invalid_request";
            errorDesc = "Proof Key for Code Exchange (PKCE) code_challenge is MANDATORY under OAuth 2.1.";
          } else if (codeChallengeMethod !== "S256" && codeChallengeMethod !== "plain") {
            error = "invalid_request";
            errorDesc = "PKCE code_challenge_method must be 'S256' or 'plain'.";
          }

          if (!error) {
            if (isCimd) {
              // Validate Client ID Metadata Document (CIMD)
              var cimdContent = context.getVariable("cimd_doc_cached") || context.getVariable("fetchCimdResponse.content");
              if (cimdContent) {
                try {
                  var cimdDoc = JSON.parse(cimdContent);
                  clientDisplayName = cimdDoc.client_name || cimdDoc.client_id || clientId;
                  var allowedUris = cimdDoc.redirect_uris || [];
                  var uriMatch = false;
                  for (var i = 0; i < allowedUris.length; i++) {
                    if (String(allowedUris[i]).trim() === redirectUri) {
                      uriMatch = true;
                      break;
                    }
                  }
                  if (!uriMatch && allowedUris.length > 0) {
                    error = "invalid_redirect_uri";
                    errorDesc = "redirect_uri does not match any registered in CIMD document.";
                  }
                } catch (e) {
                  error = "invalid_client";
                  errorDesc = "Failed to parse Client ID Metadata Document from URL.";
                }
              }
            } else {
              // Validate Registered DCR or Apigee App client
              var clientCached = context.getVariable("client_record_cached");
              var appRes = context.getVariable("getAppResponse.content");
              if (clientCached) {
                try {
                  var clientData = JSON.parse(clientCached);
                  clientDisplayName = clientData.client_name || clientId;
                  var uris = clientData.redirect_uris || [];
                  var matched = false;
                  for (var j = 0; j < uris.length; j++) {
                    if (String(uris[j]).trim() === redirectUri) {
                      matched = true;
                      break;
                    }
                  }
                  if (!matched && uris.length > 0) {
                    error = "invalid_redirect_uri";
                    errorDesc = "redirect_uri mismatch with client registration.";
                  }
                } catch (e2) {}
              } else if (appRes) {
                try {
                  var appData = JSON.parse(appRes);
                  clientDisplayName = appData.name || clientId;
                  if (appData.callbackUrl && appData.callbackUrl !== redirectUri) {
                    if (redirectUri.indexOf(appData.callbackUrl) !== 0) {
                      error = "invalid_redirect_uri";
                      errorDesc = "redirect_uri does not match Apigee developer app callbackUrl.";
                    }
                  }
                } catch (e3) {}
              }
            }
          }

          context.setVariable("auth_client_display_name", clientDisplayName);

          if (error) {
            context.setVariable("authorize_valid", "false");
            context.setVariable("authorize_error", error);
            context.setVariable("authorize_error_description", errorDesc);
          } else {
            context.setVariable("authorize_valid", "true");
            context.setVariable("authorize_error", "");
            context.setVariable("authorize_error_description", "");
          }

  - name: AM-AuthorizeForm
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-AuthorizeForm
        IgnoreUnresolvedVariables: "true"
        Set:
          Payload:
            metadata:
              contentType: text/html; charset=utf-8
            _text: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Authorize Access | OAuth 2.1</title>
                <style>
                  :root {
                    --primary: #2563eb;
                    --primary-hover: #1d4ed8;
                    --bg: #0f172a;
                    --card: #1e293b;
                    --border: #334155;
                    --text: #f8fafc;
                    --text-muted: #94a3b8;
                  }
                  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
                  body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
                  .container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 440px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
                  .badge { display: inline-block; background: rgba(37, 99, 235, 0.2); color: #60a5fa; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
                  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
                  p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
                  .scopes { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 24px; }
                  .scopes-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
                  .scope-tag { display: inline-block; background: #334155; color: #e2e8f0; font-size: 12px; padding: 2px 8px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; font-family: monospace; }
                  .form-group { margin-bottom: 16px; }
                  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
                  input[type="text"], input[type="password"] { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; color: #fff; font-size: 14px; outline: none; }
                  input:focus { border-color: var(--primary); }
                  .btn { width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
                  .btn:hover { background: var(--primary-hover); }
                  .error-banner { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
                </style>
              </head>
              <body>
                <div class="container">
                  <span class="badge">OAuth 2.1 Authorization</span>
                  <h1>Authorize Client</h1>
                  <p><strong>{auth_client_display_name}</strong> requests access to your MCP & REST services.</p>

                  <div class="scopes">
                    <div class="scopes-title">Requested Scopes</div>
                    <div><span class="scope-tag">{auth_scope}</span></div>
                  </div>

                  <form action="/authorize" method="POST">
                    <input type="hidden" name="client_id" value="{auth_client_id}">
                    <input type="hidden" name="redirect_uri" value="{auth_redirect_uri}">
                    <input type="hidden" name="response_type" value="{auth_response_type}">
                    <input type="hidden" name="scope" value="{auth_scope}">
                    <input type="hidden" name="state" value="{auth_state}">
                    <input type="hidden" name="code_challenge" value="{auth_code_challenge}">
                    <input type="hidden" name="code_challenge_method" value="{auth_code_challenge_method}">

                    <div class="form-group">
                      <label for="username">User Identifier / Email</label>
                      <input type="text" id="username" name="username" placeholder="user@example.com" value="mcp-user" required>
                    </div>

                    <div class="form-group">
                      <label for="password">Password / Passcode</label>
                      <input type="password" id="password" name="password" placeholder="••••••••" value="password" required>
                    </div>

                    <button type="submit" class="btn">Approve & Authorize</button>
                  </form>
                </div>
              </body>
              </html>

  - name: JS-AuthenticateAndIssueCode
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-AuthenticateAndIssueCode
        DisplayName: JS-AuthenticateAndIssueCode
        Properties: {}
        Source: |
          function randHex(len) {
            var chars = "abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            var str = "";
            for (var i = 0; i < len; i++) {
              str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
          }

          var username = (context.getVariable("request.formparam.username") || "mcp-user").trim();
          var authCode = "code_" + randHex(32);

          var codePayload = {
            "client_id": context.getVariable("auth_client_id"),
            "redirect_uri": context.getVariable("auth_redirect_uri"),
            "scope": context.getVariable("auth_scope"),
            "code_challenge": context.getVariable("auth_code_challenge"),
            "code_challenge_method": context.getVariable("auth_code_challenge_method") || "S256",
            "username": username,
            "auth_time": Math.floor(Date.now() / 1000)
          };

          context.setVariable("auth_code", authCode);
          context.setVariable("auth_code_data", JSON.stringify(codePayload));
          context.setVariable("auth_success", "true");

          var redirectUri = context.getVariable("auth_redirect_uri");
          var state = context.getVariable("auth_state") || "";
          var delimiter = redirectUri.indexOf("?") === -1 ? "?" : "&";
          var targetLocation = redirectUri + delimiter + "code=" + encodeURIComponent(authCode);
          if (state) {
            targetLocation += "&state=" + encodeURIComponent(state);
          }

          context.setVariable("auth_redirect_location", targetLocation);

