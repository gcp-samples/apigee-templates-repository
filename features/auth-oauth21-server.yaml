        CacheKey:
          Prefix: OAuth21-AccessToken
          KeyFragment:
            metadata:
              ref: introspect_token

  - name: JWT-VerifyIntrospectToken
    type: VerifyJWT
    content:
      VerifyJWT:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: JWT-VerifyIntrospectToken
        Algorithm: HS256
        IgnoreUnresolvedVariables: "true"
        SecretKey:
          Value:
            metadata:
              ref: private.jwt_signing_secret
