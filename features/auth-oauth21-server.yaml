# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: auth-oauth21-server
displayName: OAuth 2.1 Authorization Server
type: feature
description: Complete OAuth 2.1 Authorization Server supporting RESTful and MCP clients, Dynamic Client Registration (DCR - RFC 7591), Client ID Metadata Documents (CIMD), PKCE (RFC 7636), and Apigee X developer/app IDP integration.
documentation: ""
categories:
  - security
  - oauth2
  - mcp
parameters:
  - name: ISSUER_URL
    displayName: Issuer URL
    description: Base URL of the OAuth authorization server (e.g. https://api.example.com). If empty, dynamically derived from request scheme and host.
    default: ""
  - name: APIGEE_API_HOST
    displayName: Apigee API Base URL
    description: Base host for Apigee X Management API ServiceCallouts
    default: apigee.googleapis.com/v1
  - name: DEFAULT_DEVELOPER_EMAIL
    displayName: Default Developer Email
    description: Developer email in Apigee X used for Dynamic Client Registration (DCR) apps
    default: mcp-clients@apigee.internal
  - name: DEFAULT_API_PRODUCT
    displayName: Default API Product
    description: API Product to associate with newly registered DCR client apps (optional)
    default: ""
  - name: JWT_SIGNING_SECRET
    displayName: JWT Signing Secret
    description: Secret key used to sign HS256 JWT tokens
    default: apigee-oauth21-default-secure-secret-key-32bytes-min
  - name: ACCESS_TOKEN_FORMAT
    displayName: Access Token Format
    description: Format of issued access tokens ('jwt', 'opaque', or 'auto'). 'auto' uses JWT for CIMD URL clients and opaque for registered Apigee Apps.
    default: jwt
  - name: SUPPORTED_SCOPES
    displayName: Supported Scopes
    description: Space-separated list of OAuth scopes supported by this server
    default: mcp openid profile email read write
endpoints:
  - name: oauth
    basePath: /
    routes:
      - name: default
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: CORS-SetCors
          - name: JS-InitOAuthEnv

      - name: GET OAuth Protected Resource Metadata
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/.well-known/oauth-protected-resource") and (request.verb = "GET")
        steps:
          - name: JS-BuildProtectedResourceMetadata

      - name: GET OAuth Authorization Server Metadata
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/.well-known/oauth-authorization-server") and (request.verb = "GET")
        steps:
          - name: JS-BuildAuthServerMetadata

      - name: GET OpenID Configuration
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/.well-known/openid-configuration") and (request.verb = "GET")
        steps:
          - name: JS-BuildOidcConfig

      - name: GET JWKS
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/jwks.json") and (request.verb = "GET")
        steps:
          - name: JS-BuildJwksResponse

      - name: POST Dynamic Client Registration
        mode: Response
        condition: ((proxy.pathsuffix MatchesPath "/register") or (proxy.pathsuffix MatchesPath "/register-client")) and (request.verb = "POST")
        steps:
          - name: JS-ProcessDCRRequest
          - name: SC-CreateDeveloper
            condition: dcr_create_developer = "true"
          - name: SC-CreateApp
            condition: dcr_create_app = "true"
          - name: JS-ProcessDCRResponse
          - name: PC-StoreClient
            condition: dcr_success = "true"
          - name: AM-RegisterSuccess
            condition: dcr_success = "true"
          - name: AM-RegisterFailure
            condition: dcr_success = "false"

      - name: GET Authorize
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/authorize") and (request.verb = "GET")
        steps:
          - name: JS-ExtractAuthorizeParams
          - name: LC-LookupCIMD
            condition: is_cimd = "true"
          - name: SC-FetchCIMD
            condition: (is_cimd = "true") and (cimd_doc_cached = null)
          - name: LC-LookupClient
            condition: is_cimd = "false"
          - name: SC-GetApigeeApp
            condition: (is_cimd = "false") and (client_record_cached = null) and (client_id_to_lookup != null)
          - name: JS-ValidateAuthorize
          - name: AM-AuthorizeForm

      - name: POST Authorize / Consent
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/authorize") and (request.verb = "POST")
        steps:
          - name: JS-ExtractAuthorizeParams
          - name: LC-LookupCIMD
            condition: is_cimd = "true"
          - name: SC-FetchCIMD
            condition: (is_cimd = "true") and (cimd_doc_cached = null)
          - name: LC-LookupClient
            condition: is_cimd = "false"
          - name: SC-GetApigeeApp
            condition: (is_cimd = "false") and (client_record_cached = null) and (client_id_to_lookup != null)
          - name: JS-ValidateAuthorize
          - name: JS-AuthenticateAndIssueCode
            condition: authorize_valid = "true"
          - name: PC-StoreCode
            condition: (authorize_valid = "true") and (auth_success = "true")
          - name: AM-AuthorizeRedirect
            condition: (authorize_valid = "true") and (auth_success = "true")
          - name: AM-AuthorizeErrorResponse
            condition: (authorize_valid = "false") or (auth_success = "false")

      - name: POST Token
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/token") and (request.verb = "POST")
        steps:
          - name: JS-ExtractTokenParams
          - name: LC-LookupCode
            condition: token_grant_type = "authorization_code"
          - name: LC-LookupRefreshToken
            condition: token_grant_type = "refresh_token"
          - name: LC-LookupCIMD
            condition: (token_grant_type = "client_credentials") and (is_cimd = "true")
          - name: SC-FetchCIMD
            condition: (token_grant_type = "client_credentials") and (is_cimd = "true") and (cimd_doc_cached = null)
          - name: LC-LookupClient
            condition: (token_grant_type = "client_credentials") and (is_cimd = "false")
          - name: SC-GetApigeeApp
            condition: (token_grant_type = "client_credentials") and (is_cimd = "false") and (client_record_cached = null) and (client_id_to_lookup != null)
          - name: JS-VerifyTokenRequest
          - name: IC-InvalidateCode
            condition: (token_grant_type = "authorization_code") and (token_generation_allowed = "true")
          - name: IC-InvalidateRefreshToken
            condition: (token_grant_type = "refresh_token") and (token_generation_allowed = "true")
          - name: JWT-GenerateAccessToken
            condition: (token_generation_allowed = "true") and (token_format_to_issue = "jwt")
          - name: JWT-GenerateIDToken
            condition: (token_generation_allowed = "true") and (token_scope_has_openid = "true")
          - name: JS-FinalizeTokenResponse
            condition: token_generation_allowed = "true"
          - name: PC-StoreOpaqueAccessToken
            condition: (token_generation_allowed = "true") and (token_format_to_issue = "opaque")
          - name: PC-StoreRefreshToken
            condition: token_generation_allowed = "true"
          - name: AM-TokenResponse
            condition: token_generation_allowed = "true"
          - name: AM-TokenErrorResponse
            condition: (token_generation_allowed = "false") or (token_error != null)

      - name: POST Introspect
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/introspect") and (request.verb = "POST")
        steps:
          - name: JS-ExtractIntrospectParams
          - name: LC-LookupOpaqueIntrospectToken
            condition: (introspect_token != null) and (introspect_token_format = "opaque")
          - name: JWT-VerifyIntrospectToken
            condition: (introspect_token != null) and (introspect_token_format = "jwt")
          - name: JS-FormatIntrospectResponse

      - name: GET or POST UserInfo
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/userinfo") and ((request.verb = "GET") or (request.verb = "POST"))
        steps:
          - name: JS-ExtractBearerToken
          - name: LC-LookupOpaqueUserInfoToken
            condition: (bearer_token != null) and (userinfo_token_format = "opaque")
          - name: JWT-VerifyUserInfoToken
            condition: (bearer_token != null) and (userinfo_token_format = "jwt")
          - name: JS-FormatUserInfoResponse
            condition: bearer_token != null
          - name: AM-UserInfoResponse
            condition: userinfo_valid = "true"
          - name: AM-UserInfoErrorResponse
            condition: userinfo_valid = "false"

      - name: POST Revoke
        mode: Response
        condition: (proxy.pathsuffix MatchesPath "/revoke") and (request.verb = "POST")
        steps:
          - name: JS-ProcessRevocation
          - name: IC-InvalidateRevokedOpaqueAccessToken
            condition: revoke_token_type = "access_token"
          - name: IC-InvalidateRevokedRefreshToken
            condition: revoke_token_type = "refresh_token"
          - name: IC-InvalidateRevokedCode
            condition: revoke_token_type = "code"
          - name: AM-RevokeSuccess
    faultRules: []
targets: []
policies:
  - name: CORS-SetCors
    type: CORS
    content:
      CORS:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: CORS-SetCors
        DisplayName: CORS-SetCors
        AllowOrigins: "{request.header.origin}"
        AllowMethods: GET, PUT, POST, DELETE, OPTIONS
        AllowHeaders: "*"
        ExposeHeaders: "*"
        MaxAge: "3628800"
        AllowCredentials: "true"
        GeneratePreflightResponse: "true"
        IgnoreUnresolvedVariables: "true"

  - name: JS-InitOAuthEnv
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-InitOAuthEnv
        DisplayName: JS-InitOAuthEnv
        Properties: {}
        Source: |
          var paramIssuer = (context.getVariable("ISSUER_URL") || "").trim();
          var scheme = context.getVariable("client.scheme") || "https";
          var host = context.getVariable("request.header.host") || "localhost";
          var computedIssuer = paramIssuer || (scheme + "://" + host);

          context.setVariable("oauth_issuer_url", computedIssuer);

          var apiHost = (context.getVariable("APIGEE_API_HOST") || "apigee.googleapis.com/v1").trim();
          apiHost = apiHost.replace(/^https?:\/\//i, "");
          context.setVariable("apigee_api_host", apiHost);

          var devEmail = (context.getVariable("DEFAULT_DEVELOPER_EMAIL") || "mcp-clients@apigee.internal").trim();
          context.setVariable("default_dev_email", devEmail);

          var apiProduct = (context.getVariable("DEFAULT_API_PRODUCT") || "").trim();
          context.setVariable("default_api_product", apiProduct);

          var jwtSecret = (context.getVariable("JWT_SIGNING_SECRET") || "apigee-oauth21-default-secure-secret-key-32bytes-min").trim();
          context.setVariable("private.jwt_signing_secret", jwtSecret);

          var tokenFormatParam = (context.getVariable("ACCESS_TOKEN_FORMAT") || "jwt").trim().toLowerCase();
          if (tokenFormatParam !== "opaque" && tokenFormatParam !== "auto") {
            tokenFormatParam = "jwt";
          }
          context.setVariable("oauth_token_format_pref", tokenFormatParam);

          var supportedScopes = (context.getVariable("SUPPORTED_SCOPES") || "mcp openid profile email read write").trim();
          context.setVariable("supported_scopes", supportedScopes);

  - name: JS-BuildProtectedResourceMetadata
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildProtectedResourceMetadata
        DisplayName: JS-BuildProtectedResourceMetadata
        Properties: {}
        Source: |
          var issuer = context.getVariable("oauth_issuer_url");
          var scopesStr = context.getVariable("supported_scopes") || "mcp openid profile email read write";
          var scopes = scopesStr.split(/\s+/).filter(Boolean);

          var metadata = {
            "resource": issuer + "/mcp",
            "authorization_servers": [issuer],
            "scopes_supported": scopes,
            "bearer_methods_supported": ["header"],
            "resource_documentation": issuer + "/docs"
          };

          context.setVariable("response.content", JSON.stringify(metadata, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-BuildAuthServerMetadata
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildAuthServerMetadata
        DisplayName: JS-BuildAuthServerMetadata
        Properties: {}
        Source: |
          var issuer = context.getVariable("oauth_issuer_url");
          var scopesStr = context.getVariable("supported_scopes") || "mcp openid profile email read write";
          var scopes = scopesStr.split(/\s+/).filter(Boolean);

          var metadata = {
            "issuer": issuer,
            "authorization_endpoint": issuer + "/authorize",
            "token_endpoint": issuer + "/token",
            "registration_endpoint": issuer + "/register",
            "introspection_endpoint": issuer + "/introspect",
            "revocation_endpoint": issuer + "/revoke",
            "userinfo_endpoint": issuer + "/userinfo",
            "jwks_uri": issuer + "/jwks.json",
            "scopes_supported": scopes,
            "response_types_supported": ["code"],
            "response_modes_supported": ["query"],
            "grant_types_supported": ["authorization_code", "refresh_token", "client_credentials"],
            "token_endpoint_auth_methods_supported": ["none", "client_secret_post", "client_secret_basic"],
            "code_challenge_methods_supported": ["S256", "plain"],
            "client_id_metadata_document_supported": true
          };

          context.setVariable("response.content", JSON.stringify(metadata, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-BuildOidcConfig
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildOidcConfig
        DisplayName: JS-BuildOidcConfig
        Properties: {}
        Source: |
          var issuer = context.getVariable("oauth_issuer_url");
          var scopesStr = context.getVariable("supported_scopes") || "mcp openid profile email read write";
          var scopes = scopesStr.split(/\s+/).filter(Boolean);

          var oidcConfig = {
            "issuer": issuer,
            "authorization_endpoint": issuer + "/authorize",
            "token_endpoint": issuer + "/token",
            "userinfo_endpoint": issuer + "/userinfo",
            "jwks_uri": issuer + "/jwks.json",
            "registration_endpoint": issuer + "/register",
            "scopes_supported": scopes,
            "response_types_supported": ["code"],
            "grant_types_supported": ["authorization_code", "refresh_token", "client_credentials"],
            "subject_types_supported": ["public"],
            "id_token_signing_alg_values_supported": ["HS256"],
            "code_challenge_methods_supported": ["S256", "plain"]
          };

          context.setVariable("response.content", JSON.stringify(oidcConfig, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-BuildJwksResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-BuildJwksResponse
        DisplayName: JS-BuildJwksResponse
        Properties: {}
        Source: |
          var jwks = {
            "keys": [
              {
                "kty": "oct",
                "use": "sig",
                "alg": "HS256",
                "kid": "apigee-oauth21-key-1"
              }
            ]
          };
          context.setVariable("response.content", JSON.stringify(jwks, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-ProcessDCRRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessDCRRequest
        DisplayName: JS-ProcessDCRRequest
        Properties: {}
        Source: |
          try {
            var bodyStr = context.getVariable("request.content") || "{}";
            var body = JSON.parse(bodyStr);

            var clientName = (body.client_name || "MCP Client").trim();
            var redirectUris = body.redirect_uris;

            if (!redirectUris || !Array.isArray(redirectUris) || redirectUris.length === 0) {
              throw new Error("Missing required 'redirect_uris' array.");
            }

            var devEmail = context.getVariable("default_dev_email");
            var apiProduct = context.getVariable("default_api_product");

            function randHex(len) {
              var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
              var str = "";
              for (var i = 0; i < len; i++) {
                str += chars.charAt(Math.floor(Math.random() * chars.length));
              }
              return str;
            }

            var safeName = clientName.toLowerCase().replace(/[^a-z0-9_-]/g, "_").substring(0, 20);
            var appName = "app_" + safeName + "_" + randHex(8);

            context.setVariable("dcr_client_name", clientName);
            context.setVariable("dcr_dev_email", devEmail);
            context.setVariable("dcr_dev_username", "mcp_dev_" + randHex(6));
            context.setVariable("dcr_dev_first_name", "MCP");
            context.setVariable("dcr_dev_last_name", "Developer");
            context.setVariable("dcr_app_name", appName);
            context.setVariable("dcr_primary_redirect_uri", redirectUris[0]);
            context.setVariable("dcr_redirect_uris_json", JSON.stringify(redirectUris));
            context.setVariable("dcr_grant_types_json", JSON.stringify(body.grant_types || ["authorization_code", "refresh_token", "client_credentials"]));
            context.setVariable("dcr_scope", body.scope || context.getVariable("supported_scopes") || "mcp openid profile email");

            var appPayload = {
              "name": appName,
              "callbackUrl": redirectUris[0],
              "attributes": [
                { "name": "redirect_uris", "value": JSON.stringify(redirectUris) },
                { "name": "grant_types", "value": JSON.stringify(body.grant_types || ["authorization_code", "refresh_token", "client_credentials"]) },
                { "name": "scope", "value": body.scope || "mcp openid profile email" }
              ]
            };

            if (apiProduct) {
              appPayload.apiProducts = [apiProduct];
            }

            context.setVariable("dcr_create_app_payload", JSON.stringify(appPayload));
            context.setVariable("dcr_create_developer", "true");
            context.setVariable("dcr_create_app", "true");
            context.setVariable("dcr_raw_request", JSON.stringify(body));
            context.setVariable("dcr_error", "");

          } catch (e) {
            context.setVariable("dcr_create_developer", "false");
            context.setVariable("dcr_create_app", "false");
            context.setVariable("dcr_success", "false");
            context.setVariable("dcr_error", "invalid_client_metadata");
            context.setVariable("dcr_error_description", e.message || String(e));
          }

  - name: SC-CreateDeveloper
    type: ServiceCallout
    content:
      ServiceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-CreateDeveloper
        DisplayName: SC-CreateDeveloper
        Properties: {}
        Request:
          metadata:
            clearPayload: "true"
            variable: createDevRequest
          IgnoreUnresolvedVariables: "true"
          Set:
            Verb: POST
            Headers:
              Header:
                - metadata:
                    name: Content-Type
                  _text: application/json
            Payload:
              metadata:
                contentType: application/json
              _text: |
                {
                  "email": "{dcr_dev_email}",
                  "firstName": "{dcr_dev_first_name}",
                  "lastName": "{dcr_dev_last_name}",
                  "userName": "{dcr_dev_username}"
                }
        Response: createDevResponse
        HTTPTargetConnection:
          Properties: {}
          URL: "https://{apigee_api_host}/organizations/{organization.name}/developers"
          Authentication:
            GoogleAccessToken:
              Scopes:
                Scope: https://www.googleapis.com/auth/cloud-platform

  - name: SC-CreateApp
    type: ServiceCallout
    content:
      ServiceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-CreateApp
        DisplayName: SC-CreateApp
        Properties: {}
        Request:
          metadata:
            clearPayload: "true"
            variable: createAppRequest
          IgnoreUnresolvedVariables: "true"
          Set:
            Verb: POST
            Headers:
              Header:
                - metadata:
                    name: Content-Type
                  _text: application/json
            Payload:
              metadata:
                contentType: application/json
              _text: "{dcr_create_app_payload}"
        Response: createAppResponse
        HTTPTargetConnection:
          Properties: {}
          URL: "https://{apigee_api_host}/organizations/{organization.name}/developers/{dcr_dev_email}/apps"
          Authentication:
            GoogleAccessToken:
              Scopes:
                Scope: https://www.googleapis.com/auth/cloud-platform

  - name: JS-ProcessDCRResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessDCRResponse
        DisplayName: JS-ProcessDCRResponse
        Properties: {}
        Source: |
          try {
            if (context.getVariable("dcr_error")) {
              context.setVariable("dcr_success", "false");
            } else {
              function randHex(len) {
                var chars = "abcdefghijklmnopqrstuvwxyz0123456789";
                var str = "";
                for (var i = 0; i < len; i++) {
                  str += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return str;
              }

              var clientId = "";
              var clientSecret = "";

              var appResContent = context.getVariable("createAppResponse.content");
              if (appResContent) {
                try {
                  var appRes = JSON.parse(appResContent);
                  if (appRes.credentials && appRes.credentials.length > 0) {
                    clientId = appRes.credentials[0].consumerKey;
                    clientSecret = appRes.credentials[0].consumerSecret;
                  }
                } catch (e) {
                  // Fallback if parsing fails
                }
              }

              // Self-contained fallback if Apigee Admin API credentials were not returned
              if (!clientId) {
                clientId = "mcp_client_" + randHex(16);
                clientSecret = "mcp_sec_" + randHex(32);
              }

              var rawReq = JSON.parse(context.getVariable("dcr_raw_request") || "{}");
              var redirectUris = JSON.parse(context.getVariable("dcr_redirect_uris_json") || "[]");
              var grantTypes = JSON.parse(context.getVariable("dcr_grant_types_json") || '["authorization_code", "refresh_token", "client_credentials"]');

              var clientRecord = {
                "client_id": clientId,
                "client_secret": clientSecret,
                "client_name": context.getVariable("dcr_client_name"),
                "redirect_uris": redirectUris,
                "grant_types": grantTypes,
                "response_types": rawReq.response_types || ["code"],
                "scope": context.getVariable("dcr_scope"),
                "token_endpoint_auth_method": rawReq.token_endpoint_auth_method || "client_secret_post",
                "client_id_issued_at": Math.floor(Date.now() / 1000)
              };

              context.setVariable("client_id_to_lookup", clientId);
              context.setVariable("client_record_data", JSON.stringify(clientRecord));
              context.setVariable("dcr_success", "true");
              context.setVariable("dcr_response_json", JSON.stringify(clientRecord, null, 2));
            }
          } catch (err) {
            context.setVariable("dcr_success", "false");
            context.setVariable("dcr_error", "server_error");
            context.setVariable("dcr_error_description", "Failed to process dynamic client registration: " + err);
          }

  - name: PC-StoreClient
    type: PopulateCache
    content:
      PopulateCache:
        metadata:
          name: PC-StoreClient
        CacheKey:
          Prefix: OAuth21-Client
          KeyFragment:
            metadata:
              ref: client_id_to_lookup
        ExpirySettings:
          TimeoutInSec: "86400"
        Source: client_record_data

  - name: AM-RegisterSuccess
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RegisterSuccess
        Set:
          StatusCode: "201"
          ReasonPhrase: Created
          Payload:
            metadata:
              contentType: application/json
            _text: "{dcr_response_json}"

  - name: AM-RegisterFailure
    type: AssignMessage
    content:
      AssignMessage:
        metadata:
          name: AM-RegisterFailure
        Set:
          StatusCode: "400"
          ReasonPhrase: Bad Request
          Payload:
            metadata:
              contentType: application/json
            _text: |
              {
                "error": "{dcr_error}",
                "error_description": "{dcr_error_description}"
              }

  - name: JS-ExtractAuthorizeParams
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractAuthorizeParams
        DisplayName: JS-ExtractAuthorizeParams
        Properties: {}
        Source: |
          var verb = context.getVariable("request.verb");
          var clientId, redirectUri, responseType, scope, state, codeChallenge, codeChallengeMethod;

          if (verb === "POST") {
            clientId = context.getVariable("request.formparam.client_id") || "";
            redirectUri = context.getVariable("request.formparam.redirect_uri") || "";
            responseType = context.getVariable("request.formparam.response_type") || "";
            scope = context.getVariable("request.formparam.scope") || "";
            state = context.getVariable("request.formparam.state") || "";
            codeChallenge = context.getVariable("request.formparam.code_challenge") || "";
            codeChallengeMethod = context.getVariable("request.formparam.code_challenge_method") || "";
          } else {
            clientId = context.getVariable("request.queryparam.client_id") || "";
            redirectUri = context.getVariable("request.queryparam.redirect_uri") || "";
            responseType = context.getVariable("request.queryparam.response_type") || "";
            scope = context.getVariable("request.queryparam.scope") || "";
            state = context.getVariable("request.queryparam.state") || "";
            codeChallenge = context.getVariable("request.queryparam.code_challenge") || "";
            codeChallengeMethod = context.getVariable("request.queryparam.code_challenge_method") || "";
          }

          clientId = clientId.trim();
          redirectUri = redirectUri.trim();

          context.setVariable("auth_client_id", clientId);
          context.setVariable("auth_redirect_uri", redirectUri);
          context.setVariable("auth_response_type", responseType);
          context.setVariable("auth_scope", scope || "mcp");
          context.setVariable("auth_state", state);
          context.setVariable("auth_code_challenge", codeChallenge);
          context.setVariable("auth_code_challenge_method", codeChallengeMethod || "S256");

          // Determine if client_id is a Client ID Metadata Document URL (CIMD)
          if (clientId.indexOf("http://") === 0 || clientId.indexOf("https://") === 0) {
            context.setVariable("is_cimd", "true");
            var targetUrl = clientId.replace(/^https?:\/\//i, "");
            context.setVariable("cimd_target_url", targetUrl);
            context.setVariable("cimd_client_id", clientId);
            context.setVariable("client_id_to_lookup", "");
          } else {
            context.setVariable("is_cimd", "false");
            context.setVariable("cimd_target_url", "");
            context.setVariable("cimd_client_id", "");
            context.setVariable("client_id_to_lookup", clientId);
          }

