  - name: JS-FormatUserInfoResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-FormatUserInfoResponse
        DisplayName: JS-FormatUserInfoResponse
        Properties: {}
        Source: |
          var tokenFormat = context.getVariable("userinfo_token_format");
          var valid = false;
          var sub = "", name = "", email = "", scope = "";

          if (tokenFormat === "jwt") {
            var jwtValid = context.getVariable("jwt.JWT-VerifyUserInfoToken.valid") === "true" || context.getVariable("jwt.JWT-VerifyUserInfoToken.valid") === true;
            if (jwtValid) {
              valid = true;
              sub = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.subject") || "";
              name = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.name") || "";
              email = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.email") || "";
              scope = context.getVariable("jwt.JWT-VerifyUserInfoToken.claim.scope") || "";
            }
          } else if (tokenFormat === "opaque") {
            var opaqueDataStr = context.getVariable("opaque_userinfo_data");
            if (opaqueDataStr) {
              try {
                var oData = JSON.parse(opaqueDataStr);
                valid = true;
                sub = oData.sub || "";
                name = oData.name || "";
                email = oData.email || "";
                scope = oData.scope || "";
              } catch (e) {}
            }
          }

          context.setVariable("userinfo_valid", valid ? "true" : "false");
          if (valid) {
            var uObj = { sub: sub, name: name, email: email, scope: scope };
            context.setVariable("userinfo_response_payload", JSON.stringify(uObj, null, 2));
          }

