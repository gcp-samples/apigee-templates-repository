  - name: JS-VerifyTokenRequest
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-VerifyTokenRequest
        DisplayName: JS-VerifyTokenRequest
        Properties: {}
        Source: |
          // Pure JS SHA-256 for PKCE S256 validation
          function sha256_base64url(ascii) {
            function rotateRight(n, x) { return (n >>> x) | (n << (32 - x)); }
            var h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
            var h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
            var k = [
              0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
              0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
              0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
              0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
              0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
              0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
              0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
              0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
            ];
            var msgBytes = [];
            for (var i = 0; i < ascii.length; i++) msgBytes.push(ascii.charCodeAt(i) & 0xFF);
            var msgLenBits = msgBytes.length * 8;
            msgBytes.push(0x80);
            while ((msgBytes.length + 8) % 64 !== 0) msgBytes.push(0x00);
            msgBytes.push(0x00, 0x00, 0x00, 0x00, (msgLenBits >>> 24) & 0xFF, (msgLenBits >>> 16) & 0xFF, (msgLenBits >>> 8) & 0xFF, msgLenBits & 0xFF);

            for (var chunkStart = 0; chunkStart < msgBytes.length; chunkStart += 64) {
              var w = new Array(64);
              for (var i = 0; i < 16; i++) {
                w[i] = (msgBytes[chunkStart + i * 4] << 24) | (msgBytes[chunkStart + i * 4 + 1] << 16) | (msgBytes[chunkStart + i * 4 + 2] << 8) | msgBytes[chunkStart + i * 4 + 3];
              }
              for (var i = 16; i < 64; i++) {
                var s0 = rotateRight(w[i - 15], 7) ^ rotateRight(w[i - 15], 18) ^ (w[i - 15] >>> 3);
                var s1 = rotateRight(w[i - 2], 17) ^ rotateRight(w[i - 2], 19) ^ (w[i - 2] >>> 10);
                w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
              }
              var a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
              for (var i = 0; i < 64; i++) {
                var s1_e = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
                var ch = (e & f) ^ (~e & g);
                var temp1 = (h + s1_e + ch + k[i] + w[i]) | 0;
                var s0_a = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
                var maj = (a & b) ^ (a & c) ^ (b & c);
                var temp2 = (s0_a + maj) | 0;
                h = g; g = f; f = e; e = (d + temp1) | 0; d = c; c = b; b = a; a = (temp1 + temp2) | 0;
              }
              h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
              h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
            }
            var bytes = [];
            var words = [h0, h1, h2, h3, h4, h5, h6, h7];
            for (var i = 0; i < 8; i++) {
              bytes.push((words[i] >>> 24) & 0xFF, (words[i] >>> 16) & 0xFF, (words[i] >>> 8) & 0xFF, words[i] & 0xFF);
            }
            var base64 = "";
            var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
            for (var i = 0; i < bytes.length; i += 3) {
              var b1 = bytes[i], b2 = i + 1 < bytes.length ? bytes[i + 1] : NaN, b3 = i + 2 < bytes.length ? bytes[i + 2] : NaN;
              var enc1 = b1 >> 2;
              var enc2 = ((b1 & 3) << 4) | (isNaN(b2) ? 0 : b2 >> 4);
              var enc3 = isNaN(b2) ? NaN : (((b2 & 15) << 2) | (isNaN(b3) ? 0 : b3 >> 6));
              var enc4 = isNaN(b3) ? NaN : b3 & 63;
              base64 += chars.charAt(enc1) + chars.charAt(enc2);
              if (!isNaN(enc3)) base64 += chars.charAt(enc3);
              if (!isNaN(enc4)) base64 += chars.charAt(enc4);
            }
            return base64;
          }

          var grantType = context.getVariable("token_grant_type");
          var issuer = context.getVariable("oauth_issuer_url");
          var error = null;
          var errorDesc = null;

          if (grantType === "authorization_code") {
            var codeDataStr = context.getVariable("auth_code_data");
            var codeVerifier = context.getVariable("token_code_verifier") || "";
            var clientIdSub = context.getVariable("token_client_id");
            var redirectUriSub = context.getVariable("token_redirect_uri");

            if (!codeDataStr) {
              error = "invalid_grant";
              errorDesc = "Authorization code is invalid or expired.";
            } else {
              try {
                var codeData = JSON.parse(codeDataStr);
                if (clientIdSub && clientIdSub !== codeData.client_id) {
                  error = "invalid_client";
                  errorDesc = "client_id mismatch.";
                } else if (redirectUriSub && redirectUriSub !== codeData.redirect_uri) {
                  error = "invalid_grant";
                  errorDesc = "redirect_uri mismatch.";
                } else if (!codeVerifier) {
                  error = "invalid_request";
                  errorDesc = "code_verifier parameter is required for PKCE.";
                } else {
                  var expectedChallenge = codeData.code_challenge;
                  var method = codeData.code_challenge_method || "S256";
                  var calculated = (method === "S256") ? sha256_base64url(codeVerifier) : codeVerifier;
                  if (calculated !== expectedChallenge) {
                    error = "invalid_grant";
                    errorDesc = "PKCE verification failed.";
                  }
                }

                if (!error) {
                  context.setVariable("token_issuer", issuer);
                  context.setVariable("token_client_id", codeData.client_id);
                  context.setVariable("token_subject", codeData.username || codeData.client_id);
                  context.setVariable("token_email", codeData.username + "@example.com");
                  context.setVariable("token_name", codeData.username || "MCP User");
                  var scope = codeData.scope || "mcp";
                  context.setVariable("token_scope", scope);
                  context.setVariable("token_type_claim", "Bearer");
                  context.setVariable("token_auth_time", String(codeData.auth_time || Math.floor(Date.now() / 1000)));
                  context.setVariable("token_nonce", "nonce_" + String(Date.now()));
                  context.setVariable("token_scope_has_openid", scope.indexOf("openid") !== -1 ? "true" : "false");
                  context.setVariable("token_generation_allowed", "true");
                }
              } catch (e) {
                error = "invalid_grant";
                errorDesc = "Failed to parse authorization code.";
              }
            }
          } else if (grantType === "refresh_token") {
            var refreshDataStr = context.getVariable("refresh_token_data");
            var clientIdReq = context.getVariable("token_client_id");

            if (!refreshDataStr) {
              error = "invalid_grant";
              errorDesc = "Refresh token is invalid or expired.";
            } else {
              try {
                var rData = JSON.parse(refreshDataStr);
                if (clientIdReq && clientIdReq !== rData.client_id) {
                  error = "invalid_client";
                  errorDesc = "client_id mismatch with refresh token.";
                } else {
                  context.setVariable("token_issuer", issuer);
                  context.setVariable("token_client_id", rData.client_id);
                  context.setVariable("token_subject", rData.username || rData.client_id);
                  context.setVariable("token_email", rData.email || (rData.username + "@example.com"));
                  context.setVariable("token_name", rData.name || rData.username || "MCP User");
                  var rScope = rData.scope || "mcp";
                  context.setVariable("token_scope", rScope);
                  context.setVariable("token_type_claim", "Bearer");
                  context.setVariable("token_auth_time", String(Math.floor(Date.now() / 1000)));
                  context.setVariable("token_nonce", "nonce_" + String(Date.now()));
                  context.setVariable("token_scope_has_openid", rScope.indexOf("openid") !== -1 ? "true" : "false");
                  context.setVariable("token_generation_allowed", "true");
                }
              } catch (e2) {
                error = "invalid_grant";
                errorDesc = "Failed to parse refresh token.";
              }
            }
          } else if (grantType === "client_credentials") {
            var ccClientId = context.getVariable("token_client_id");
            var ccScope = context.getVariable("token_scope_req") || "mcp";

            if (!ccClientId) {
              error = "invalid_client";
              errorDesc = "client_id is required for client_credentials grant.";
            } else {
              context.setVariable("token_issuer", issuer);
              context.setVariable("token_client_id", ccClientId);
              context.setVariable("token_subject", ccClientId);
              context.setVariable("token_email", ccClientId + "@service.apigee.internal");
              context.setVariable("token_name", ccClientId);
              context.setVariable("token_scope", ccScope);
              context.setVariable("token_type_claim", "Bearer");
              context.setVariable("token_auth_time", String(Math.floor(Date.now() / 1000)));
              context.setVariable("token_scope_has_openid", "false");
              context.setVariable("token_generation_allowed", "true");
            }
          } else {
            error = "unsupported_grant_type";
            errorDesc = "Unsupported grant_type. Supported values: authorization_code, refresh_token, client_credentials.";
          }

          if (error) {
            context.setVariable("token_generation_allowed", "false");
            context.setVariable("token_error", error);
            context.setVariable("token_error_description", errorDesc);
          } else {
            var tokenFormatPref = context.getVariable("oauth_token_format_pref") || "jwt";
            var isCimd = context.getVariable("is_cimd") === "true";
            var actualFormat = "jwt";

            if (tokenFormatPref === "opaque") {
              actualFormat = "opaque";
            } else if (tokenFormatPref === "auto") {
              actualFormat = isCimd ? "jwt" : "opaque";
            } else {
              actualFormat = "jwt";
            }
            context.setVariable("token_format_to_issue", actualFormat);
          }

