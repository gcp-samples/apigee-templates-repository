  - name: JS-FinalizeTokenResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-FinalizeTokenResponse
        DisplayName: JS-FinalizeTokenResponse
        Properties: {}
        Source: |
          function randHex(len) {
            var chars = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
            var str = "";
            for (var i = 0; i < len; i++) {
              str += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return str;
          }

          var grantType = context.getVariable("token_grant_type");
          var formatToIssue = context.getVariable("token_format_to_issue") || "jwt";
          var accessToken = "";

          if (formatToIssue === "opaque") {
            accessToken = "at_" + randHex(32);
            context.setVariable("token_access_token", accessToken);

            var opaqueTokenRecord = {
              "access_token": accessToken,
              "client_id": context.getVariable("token_client_id"),
              "sub": context.getVariable("token_subject"),
              "email": context.getVariable("token_email"),
              "name": context.getVariable("token_name"),
              "scope": context.getVariable("token_scope"),
              "iss": context.getVariable("token_issuer"),
              "exp": Math.floor(Date.now() / 1000) + 3600,
              "iat": Math.floor(Date.now() / 1000)
            };
            context.setVariable("opaque_access_token_data", JSON.stringify(opaqueTokenRecord));
          } else {
            accessToken = context.getVariable("token_access_token");
          }

          var newRefreshToken = "rt_" + randHex(32);
          context.setVariable("token_refresh_token", newRefreshToken);

          var refreshRecord = {
            "client_id": context.getVariable("token_client_id"),
            "username": context.getVariable("token_subject"),
            "email": context.getVariable("token_email"),
            "name": context.getVariable("token_name"),
            "scope": context.getVariable("token_scope")
          };
          context.setVariable("new_refresh_token_data", JSON.stringify(refreshRecord));

          var responseObj = {
            "access_token": accessToken,
            "token_type": "Bearer",
            "expires_in": 3600,
            "scope": context.getVariable("token_scope")
          };

          if (grantType !== "client_credentials") {
            responseObj.refresh_token = newRefreshToken;
          }

          if (context.getVariable("token_scope_has_openid") === "true") {
            var idToken = context.getVariable("token_id_token");
            if (idToken) {
              responseObj.id_token = idToken;
            }
          }

          context.setVariable("final_token_response", JSON.stringify(responseObj, null, 2));

