  - name: JS-ExtractIntrospectParams
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractIntrospectParams
        DisplayName: JS-ExtractIntrospectParams
        Properties: {}
        Source: |
          var token = (context.getVariable("request.formparam.token") || "").trim();
          if (!token) {
            token = (context.getVariable("request.queryparam.token") || "").trim();
          }
          context.setVariable("introspect_token", token);

          if (token.split(".").length === 3) {
            context.setVariable("introspect_token_format", "jwt");
          } else if (token) {
            context.setVariable("introspect_token_format", "opaque");
          } else {
            context.setVariable("introspect_token_format", "none");
          }

