  - name: JS-FormatIntrospectResponse
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-FormatIntrospectResponse
        DisplayName: JS-FormatIntrospectResponse
        Properties: {}
        Source: |
          var tokenFormat = context.getVariable("introspect_token_format");
          var result = { active: false };

          if (tokenFormat === "jwt") {
            var isValid = context.getVariable("jwt.JWT-VerifyIntrospectToken.valid") === "true" || context.getVariable("jwt.JWT-VerifyIntrospectToken.valid") === true;
            if (isValid) {
              result.active = true;
              result.sub = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.subject") || "";
              result.scope = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.scope") || "";
              result.client_id = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.client_id") || "";
              result.iss = context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.issuer") || "";
              result.exp = parseInt(context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.expiry") || "0", 10);
              result.iat = parseInt(context.getVariable("jwt.JWT-VerifyIntrospectToken.claim.issued_at") || "0", 10);
              result.token_type = "Bearer";
            }
          } else if (tokenFormat === "opaque") {
            var opaqueDataStr = context.getVariable("opaque_introspect_data");
            if (opaqueDataStr) {
              try {
                var oData = JSON.parse(opaqueDataStr);
                result.active = true;
                result.sub = oData.sub || "";
                result.scope = oData.scope || "";
                result.client_id = oData.client_id || "";
                result.iss = oData.iss || "";
                result.exp = oData.exp || 0;
                result.iat = oData.iat || 0;
                result.token_type = "Bearer";
              } catch (e) {}
            }
          }

          context.setVariable("response.content", JSON.stringify(result, null, 2));
          context.setVariable("response.header.Content-Type", "application/json");
          context.setVariable("response.status.code", 200);

  - name: JS-ExtractBearerToken
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractBearerToken
        DisplayName: JS-ExtractBearerToken
        Properties: {}
        Source: |
          var authHeader = context.getVariable("request.header.Authorization") || "";
          var bearerToken = "";
          if (authHeader.indexOf("Bearer ") === 0) {
            bearerToken = authHeader.substring(7).trim();
          }
          context.setVariable("bearer_token", bearerToken);

          if (bearerToken.split(".").length === 3) {
            context.setVariable("userinfo_token_format", "jwt");
          } else if (bearerToken) {
            context.setVariable("userinfo_token_format", "opaque");
          } else {
            context.setVariable("userinfo_token_format", "none");
          }

