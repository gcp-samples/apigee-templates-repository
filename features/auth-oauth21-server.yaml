  - name: JS-ProcessRevocation
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessRevocation
        DisplayName: JS-ProcessRevocation
        Properties: {}
        Source: |
          var token = (context.getVariable("request.formparam.token") || "").trim();
          var hint = (context.getVariable("request.formparam.token_type_hint") || "").trim();

          if (hint === "refresh_token" || token.indexOf("rt_") === 0) {
            context.setVariable("revoke_token_type", "refresh_token");
            context.setVariable("refresh_token", token);
          } else if (hint === "code" || token.indexOf("code_") === 0) {
            context.setVariable("revoke_token_type", "code");
            context.setVariable("auth_code", token);
          } else if (hint === "access_token" || token.indexOf("at_") === 0) {
            context.setVariable("revoke_token_type", "access_token");
            context.setVariable("revoke_access_token", token);
          } else {
            context.setVariable("revoke_token_type", "other");
            context.setVariable("revoke_access_token", token);
            context.setVariable("refresh_token", token);
          }

