  - name: JS-ExtractTokenParams
    type: Javascript
    content:
      Javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractTokenParams
        DisplayName: JS-ExtractTokenParams
        Properties: {}
        Source: |
          var grantType = (context.getVariable("request.formparam.grant_type") || "").trim();
          var code = (context.getVariable("request.formparam.code") || "").trim();
          var codeVerifier = (context.getVariable("request.formparam.code_verifier") || "").trim();
          var redirectUri = (context.getVariable("request.formparam.redirect_uri") || "").trim();
          var clientId = (context.getVariable("request.formparam.client_id") || "").trim();
          var clientSecret = (context.getVariable("request.formparam.client_secret") || "").trim();
          var refreshToken = (context.getVariable("request.formparam.refresh_token") || "").trim();
          var scope = (context.getVariable("request.formparam.scope") || "").trim();

          // Check Basic Authorization header for client credentials
          var authHeader = context.getVariable("request.header.Authorization") || "";
          if (authHeader.indexOf("Basic ") === 0) {
            try {
              var encoded = authHeader.substring(6).trim();
              // Pure JS Base64 decode
              var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
              var str = String(encoded).replace(/=+$/, '');
              var decoded = '';
              for (var bc = 0, bs, buffer, idx = 0; buffer = str.charAt(idx++); ~buffer && (bs = bc % 4 ? bs * 64 + buffer : buffer, bc++ % 4) ? decoded += String.fromCharCode(255 & bs >> (-2 * bc & 6)) : 0) {
                buffer = chars.indexOf(buffer);
              }
              var colonIdx = decoded.indexOf(":");
              if (colonIdx > -1) {
                if (!clientId) clientId = decoded.substring(0, colonIdx);
                if (!clientSecret) clientSecret = decoded.substring(colonIdx + 1);
              }
            } catch (e) {}
          }

          context.setVariable("token_grant_type", grantType);
          context.setVariable("token_code", code);
          context.setVariable("token_code_verifier", codeVerifier);
          context.setVariable("token_redirect_uri", redirectUri);
          context.setVariable("token_client_id", clientId);
          context.setVariable("token_client_secret", clientSecret);
          context.setVariable("token_refresh_token", refreshToken);
          context.setVariable("token_scope_req", scope);

          if (grantType === "authorization_code") {
            context.setVariable("auth_code", code);
          } else if (grantType === "refresh_token") {
            context.setVariable("refresh_token", refreshToken);
          }

          if (clientId.indexOf("http://") === 0 || clientId.indexOf("https://") === 0) {
            context.setVariable("is_cimd", "true");
            var targetUrl = clientId.replace(/^https?:\/\//i, "");
            context.setVariable("cimd_target_url", targetUrl);
            context.setVariable("cimd_client_id", clientId);
            context.setVariable("client_id_to_lookup", "");
          } else {
            context.setVariable("is_cimd", "false");
            context.setVariable("cimd_target_url", "");
            context.setVariable("cimd_client_id", "");
            context.setVariable("client_id_to_lookup", clientId);
          }

