gateway: apigee
schemaVersion: 1.0.0
name: datadog-metrics-forwarder
displayName: Datadog Custom Metrics & Event Forwarder
type: feature
description: Extracts latency, status codes, and error categories from each transaction and pushes metric series to Datadog
  v2 Metrics API via Service Callout.
categories:
- draft
- observability
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/telemetry/datadog
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-BuildDatadogSeries
    - name: SC-SendDatadogMetric
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://backend.example.com
endpoints: []
targets: []
policies:
- name: JS-BuildDatadogSeries
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-BuildDatadogSeries
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-BuildDatadogSeries
      properties: {}
      source: "// JS-BuildDatadogSeries - Custom logic for datadog-metrics-forwarder\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"datadog-metrics-forwarder.processed\"\
        , \"true\");\n    context.setVariable(\"datadog-metrics-forwarder.timestamp\", Date.now().toString());\n    \n   \
        \ // Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n  \
        \  if (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"datadog-metrics-forwarder\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-BuildDatadogSeries: \" + err);\n}\n"
- name: SC-SendDatadogMetric
  type: ServiceCallout
  content:
    serviceCallout:
      metadata:
        name: SC-SendDatadogMetric
        continueOnError: 'true'
        enabled: 'true'
      displayName: SC-SendDatadogMetric
      properties: {}
      request:
        metadata:
          clearPayload: 'false'
          variable: SC-SendDatadogMetricRequest
        ignoreUnresolvedVariables: 'true'
      response: SC-SendDatadogMetricResponse
      httpTargetConnection:
        properties: {}
        url: https://httpbin.org/anything
resources: []
tests: []
