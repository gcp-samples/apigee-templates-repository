gateway: apigee
schemaVersion: 1.0.0
name: supabase-postgrest-proxy
displayName: Supabase PostgREST API Proxy
type: feature
description: Proxies Supabase / PostgREST RESTful database endpoints with JWT verification, RLS (Row Level Security) role
  forwarding, and filter translation.
categories:
- draft
- database
parameters:
- name: TargetEndpointUrl
  default: https://{supabase.project}.supabase.co/rest/v1
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/supabase/db
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetSupabaseHeaders
    - name: JS-HandleSupabaseErrors
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://{supabase.project}.supabase.co/rest/v1
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{supabase.project}.supabase.co/rest/v1
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: supabase-postgrest-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetSupabaseHeaders
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetSupabaseHeaders
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetSupabaseHeaders
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: supabase-postgrest-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-HandleSupabaseErrors
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-HandleSupabaseErrors
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-HandleSupabaseErrors
      properties: {}
      source: "// JS-HandleSupabaseErrors - Custom logic for supabase-postgrest-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"supabase-postgrest-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"supabase-postgrest-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"supabase-postgrest-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-HandleSupabaseErrors: \" + err);\n}\n"
resources: []
tests: []
