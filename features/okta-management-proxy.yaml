gateway: apigee
schemaVersion: 1.0.0
name: okta-management-proxy
displayName: Okta Core & Users Management API Proxy
type: feature
description: Proxies Okta Management API for user provisioning, group management, and factor enrollment with SSWS API token
  authentication.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://{okta.domain}.okta.com/api/v1
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/okta/api
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetOktaSswsAuth
    - name: JS-FormatOktaUsers
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatOktaUsers
  faultRules: []
defaultTarget:
  name: default
  url: https://{okta.domain}.okta.com/api/v1
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{okta.domain}.okta.com/api/v1
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: okta-management-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetOktaSswsAuth
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetOktaSswsAuth
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetOktaSswsAuth
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: okta-management-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FormatOktaUsers
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-FormatOktaUsers
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-FormatOktaUsers
      properties: {}
      source: "// JS-FormatOktaUsers - Custom logic for okta-management-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"okta-management-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"okta-management-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"okta-management-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatOktaUsers: \" + err);\n}\n"
resources: []
tests: []
