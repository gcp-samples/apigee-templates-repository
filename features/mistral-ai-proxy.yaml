gateway: apigee
schemaVersion: 1.0.0
name: mistral-ai-proxy
displayName: Mistral AI Chat & Embeddings Proxy
type: feature
description: Proxies Mistral AI models (mistral-large, mistral-small, mistral-embed) with Bearer token authentication and
  token analytics capture.
categories:
- draft
- ai
parameters:
- name: TargetEndpointUrl
  default: https://api.mistral.ai/v1/chat/completions
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/mistral/v1/chat/completions
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetMistralAuth
    - name: JS-CaptureMistralUsage
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-CaptureMistralUsage
  faultRules: []
defaultTarget:
  name: default
  url: https://api.mistral.ai/v1/chat/completions
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://api.mistral.ai/v1/chat/completions
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: mistral-ai-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetMistralAuth
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetMistralAuth
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetMistralAuth
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: mistral-ai-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-CaptureMistralUsage
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-CaptureMistralUsage
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-CaptureMistralUsage
      properties: {}
      source: "// JS-CaptureMistralUsage - Custom logic for mistral-ai-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"mistral-ai-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"mistral-ai-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"mistral-ai-proxy\",\n                \"processedAt\": new Date().toISOString()\n     \
        \       };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-CaptureMistralUsage: \" + err);\n}\n"
resources: []
tests: []
