gateway: apigee
schemaVersion: 1.0.0
name: xml-json-path-extractor
displayName: XPath & JSONPath Dynamic Property Extractor
type: feature
description: Extracts targeted fields from large complex XML or JSON request/response bodies using XPath/JSONPath and sets
  flow variables for routing.
categories:
- draft
- transformation
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/integration/path-extract
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: Extract-Variables-JsonPath
    - name: JS-ProcessExtractedVariables
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://backend.example.com
endpoints: []
targets: []
policies:
- name: JS-ProcessExtractedVariables
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-ProcessExtractedVariables
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-ProcessExtractedVariables
      properties: {}
      source: "// JS-ProcessExtractedVariables - Custom logic for xml-json-path-extractor\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"xml-json-path-extractor.processed\"\
        , \"true\");\n    context.setVariable(\"xml-json-path-extractor.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"xml-json-path-extractor\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-ProcessExtractedVariables: \" + err);\n}\n"
resources: []
tests: []
