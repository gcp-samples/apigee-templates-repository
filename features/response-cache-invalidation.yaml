gateway: apigee
schemaVersion: 1.0.0
name: response-cache-invalidation
displayName: Response Cache with Dynamic Invalidation
type: feature
description: Caches GET query responses using Apigee ResponseCache policy, with support for instant cache invalidation on
  PUT/POST/DELETE mutations.
categories:
- draft
- traffic
parameters:
- name: TargetEndpointUrl
  default: https://backend.example.com/items
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/traffic/cached-resource
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: Invalidate-Cache-Policy
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: Response-Cache-Policy
  faultRules: []
defaultTarget:
  name: default
  url: https://backend.example.com/items
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://backend.example.com/items
endpoints: []
targets: []
policies:
- name: Response-Cache-Policy
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: Response-Cache-Policy
        continueOnError: 'true'
        enabled: 'true'
      displayName: Response-Cache-Policy
      properties: {}
      assignVariable:
        name: response-cache-invalidation.trafficState
        value: healthy
- name: Invalidate-Cache-Policy
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: Invalidate-Cache-Policy
        continueOnError: 'true'
        enabled: 'true'
      displayName: Invalidate-Cache-Policy
      properties: {}
      assignVariable:
        name: response-cache-invalidation.trafficState
        value: healthy
resources: []
tests: []
