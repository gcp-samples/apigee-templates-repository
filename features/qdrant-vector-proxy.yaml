gateway: apigee
schemaVersion: 1.0.0
name: qdrant-vector-proxy
displayName: Qdrant Vector Database Proxy
type: feature
description: Proxies Qdrant Vector Search engine REST API for nearest-neighbor point search, payload filtering, and batch
  embedding insertion with api-key authentication.
categories:
- draft
- ai
parameters:
- name: TargetEndpointUrl
  default: https://{qdrant.clusterHost}:6333/collections/{qdrant.collection}/points/search
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/qdrant
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetQdrantKey
    - name: JS-FormatQdrantHits
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-FormatQdrantHits
  faultRules: []
defaultTarget:
  name: default
  url: https://{qdrant.clusterHost}:6333/collections/{qdrant.collection}/points/search
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{qdrant.clusterHost}:6333/collections/{qdrant.collection}/points/search
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: qdrant-vector-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetQdrantKey
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetQdrantKey
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetQdrantKey
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: qdrant-vector-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-FormatQdrantHits
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-FormatQdrantHits
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-FormatQdrantHits
      properties: {}
      source: "// JS-FormatQdrantHits - Custom logic for qdrant-vector-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"qdrant-vector-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"qdrant-vector-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"qdrant-vector-proxy\",\n                \"processedAt\": new Date().toISOString()\n  \
        \          };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-FormatQdrantHits: \" + err);\n}\n"
resources: []
tests: []
