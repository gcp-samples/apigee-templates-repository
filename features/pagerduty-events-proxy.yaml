gateway: apigee
schemaVersion: 1.0.0
name: pagerduty-events-proxy
displayName: PagerDuty Events API v2 Proxy
type: feature
description: Ingests incident triggers, acknowledgments, and resolutions into PagerDuty Events API v2 with routing key injection
  and payload validation.
categories:
- draft
- saas
parameters:
- name: TargetEndpointUrl
  default: https://events.pagerduty.com/v2/enqueue
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/pagerduty/events
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: JS-EnrichPagerDutyEvent
  - name: PostFlow
    mode: Response
    steps: &id001 []
  faultRules: []
defaultTarget:
  name: default
  url: https://events.pagerduty.com/v2/enqueue
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://events.pagerduty.com/v2/enqueue
endpoints: []
targets: []
policies:
- name: JS-EnrichPagerDutyEvent
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-EnrichPagerDutyEvent
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-EnrichPagerDutyEvent
      properties: {}
      source: "// JS-EnrichPagerDutyEvent - Custom logic for pagerduty-events-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"pagerduty-events-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"pagerduty-events-proxy.timestamp\", Date.now().toString());\n    \n    //\
        \ Response processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if\
        \ (resContent) {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"\
        ] = {\n                \"feature\": \"pagerduty-events-proxy\",\n                \"processedAt\": new Date().toISOString()\n\
        \            };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch\
        \ (e2) {}\n    }\n} catch (err) {\n    print(\"Error in JS-EnrichPagerDutyEvent: \" + err);\n}\n"
resources: []
tests: []
