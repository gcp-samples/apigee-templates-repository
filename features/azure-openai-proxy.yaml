gateway: apigee
schemaVersion: 1.0.0
name: azure-openai-proxy
displayName: Azure OpenAI Deployment Gateway
type: feature
description: Proxies Azure OpenAI model deployments (GPT-4o, GPT-3.5-Turbo) with api-key header injection, rate limit monitoring,
  and usage tracking.
categories:
- draft
- azure
parameters:
- name: TargetEndpointUrl
  default: https://{azure.openaiResource}.openai.azure.com/openai/deployments/{azure.deploymentName}/chat/completions?api-version=2024-06-01
- name: EnvironmentTier
  default: production
defaultEndpoint:
  name: default
  basePath: /v1/azure/openai/deployments
  routes:
  - name: default
    target: default
  flows:
  - name: PreFlow
    mode: Request
    steps:
    - name: KVM-LoadCredentials
    - name: AM-SetAzureOpenAiKey
    - name: JS-CaptureOpenAiUsage
  - name: PostFlow
    mode: Response
    steps: &id001
    - name: JS-CaptureOpenAiUsage
  faultRules: []
defaultTarget:
  name: default
  url: https://{azure.openaiResource}.openai.azure.com/openai/deployments/{azure.deploymentName}/chat/completions?api-version=2024-06-01
  flows:
  - name: PostFlow
    mode: Response
    steps: *id001
  faultRules: []
  httpTargetConnection:
    properties: {}
    url: https://{azure.openaiResource}.openai.azure.com/openai/deployments/{azure.deploymentName}/chat/completions?api-version=2024-06-01
endpoints: []
targets: []
policies:
- name: KVM-LoadCredentials
  type: KeyValueMapOperations
  content:
    keyValueMapOperations:
      metadata:
        name: KVM-LoadCredentials
        continueOnError: 'false'
        enabled: 'true'
        mapIdentifier: azure-openai-proxy-secrets
      displayName: KVM-LoadCredentials
      properties: {}
      exclusiveCache: 'false'
      expiryTimeInSecs: '300'
      get:
      - metadata:
          assignTo: private.targetApiKey
        key:
          parameter: ApiKey
      - metadata:
          assignTo: private.targetApiSecret
        key:
          parameter: ApiSecret
      scope: environment
- name: AM-SetAzureOpenAiKey
  type: AssignMessage
  content:
    assignMessage:
      metadata:
        name: AM-SetAzureOpenAiKey
        continueOnError: 'false'
        enabled: 'true'
      displayName: AM-SetAzureOpenAiKey
      properties: {}
      set:
        headers:
          header:
          - metadata:
              name: X-Apigee-Feature
            value: azure-openai-proxy
          - metadata:
              name: X-Apigee-Time
            value: '{system.timestamp}'
      ignoreUnresolvedVariables: 'true'
      assignTo:
        metadata:
          createNew: 'false'
          transport: http
          type: request
- name: JS-CaptureOpenAiUsage
  type: Javascript
  content:
    javascript:
      metadata:
        name: JS-CaptureOpenAiUsage
        continueOnError: 'false'
        enabled: 'true'
        timeLimit: '200'
      displayName: JS-CaptureOpenAiUsage
      properties: {}
      source: "// JS-CaptureOpenAiUsage - Custom logic for azure-openai-proxy\ntry {\n    var reqContent = context.getVariable(\"\
        request.content\");\n    var reqJson = null;\n    if (reqContent) {\n        try { reqJson = JSON.parse(reqContent);\
        \ } catch (e) {}\n    }\n    \n    // Set execution context metadata\n    context.setVariable(\"azure-openai-proxy.processed\"\
        , \"true\");\n    context.setVariable(\"azure-openai-proxy.timestamp\", Date.now().toString());\n    \n    // Response\
        \ processing if in response flow\n    var resContent = context.getVariable(\"response.content\");\n    if (resContent)\
        \ {\n        try {\n            var resJson = JSON.parse(resContent);\n            resJson[\"_apigee\"] = {\n    \
        \            \"feature\": \"azure-openai-proxy\",\n                \"processedAt\": new Date().toISOString()\n   \
        \         };\n            context.setVariable(\"response.content\", JSON.stringify(resJson));\n        } catch (e2)\
        \ {}\n    }\n} catch (err) {\n    print(\"Error in JS-CaptureOpenAiUsage: \" + err);\n}\n"
resources: []
tests: []
